<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Siansa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Siansa's TV screen while casting (issue #114). The only outside file is Google's Cast receiver library. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root {
    /* Siansa's colours, as the app's icon and siansa.app: black, frost and amber. The same page serves Siansa and
       Siansa Dev, so it never takes the Dev build's purple. */
    --page: #000000; --raised: #12171C; --text: #EEF2F5; --muted: #AFC2D3; --frost: #9DB4C8;
    --amber: #FFB547; --mid-top: #FFE7C4; --mid-bottom: #E8A55A;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--page); color: var(--text);
    font-family: "Google Sans", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .screen { position: absolute; inset: 0; transition: opacity .6s ease; }
  .hidden { opacity: 0; pointer-events: none; }
  /* Sizes are in vh, so the page looks the same on TVs that draw it at 1280x720 and at 1920x1080. Everything stays
     inside the TV's safe area (5% at each edge), where some TVs cut the picture. */

  /* Splash: shown when the TV connects and while nothing is loaded. */
  #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vh; }
  .icon { width: 30vh; height: 30vh; }
  .logo { font-size: 6.7vh; font-weight: 750; letter-spacing: -.17vh; }
  /* The wordmark: Siansa with its S in the amber of the icon's middle bar, as on siansa.app. */
  .s { background: linear-gradient(180deg, var(--mid-top), var(--mid-bottom)); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  #splash-note { font-size: 2.8vh; color: var(--muted); }

  /* Now playing: the cover, the song, a thin line for where it is. No buttons: the remote's left and right go to
     the previous and next song, OK plays and pauses. */
  #backdrop { position: absolute; inset: -8vh; background-size: cover; background-position: center;
    filter: blur(8vh) brightness(.28) saturate(1.2); transition: background-image .8s ease; }
  #shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.15), rgba(0,0,0,.55)); }
  #player { display: flex; align-items: center; gap: 8vh; padding: 0 11vh; }
  #cover { position: relative; width: 58vh; height: 58vh; flex: none; border-radius: 1.6vh; overflow: hidden;
    background: var(--raised) center/cover; box-shadow: 0 3vh 8vh rgba(0,0,0,.55); }
  #cover.none { background-image: none; }
  #info { position: relative; flex: 1; min-width: 0; }
  #title { font-size: 7vh; font-weight: 700; line-height: 1.08; letter-spacing: -.12vh; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  #artist { font-size: 3.6vh; margin-top: 2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album { font-size: 2.6vh; margin-top: .8vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { margin-top: 6vh; height: .5vh; border-radius: .25vh; background: rgba(255,255,255,.16); overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--mid-bottom), var(--amber)); transition: width .5s linear; }
  #times { display: flex; justify-content: space-between; font-size: 2vh; color: var(--muted); margin-top: 1.2vh;
    font-variant-numeric: tabular-nums; }
  /* Paused: the cover darkens under the pause sign (an overlay, so the sign itself stays bright). */
  #cover::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .4s ease; }
  .paused #cover::after { opacity: 1; }
  .paused #fill { background: var(--frost); }

  /* What the remote just did (pause, play, previous, next), shown briefly over the cover; paused stays. */
  #sign { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; }
  #sign svg { width: 13vh; height: 13vh; fill: var(--text); filter: drop-shadow(0 .6vh 2vh rgba(0,0,0,.6)); }
  #sign { opacity: 0; transition: opacity .3s ease; }
  #sign.on { opacity: 1; }
  #spinner { position: absolute; right: 2.2vh; bottom: 2.2vh; width: 4.4vh; height: 4.4vh; border-radius: 50%;
    border: .46vh solid rgba(255,255,255,.2); border-top-color: var(--amber); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Siansa in the corner, quietly. */
  #brand { position: absolute; right: 7vh; bottom: 5vh; display: flex; align-items: center; gap: 1vh; opacity: .75; }
  #brand .icon { width: 6.4vh; height: 6.4vh; }
  #brand .logo { font-size: 3vh; }
</style>
</head>

  </svg>
  <div class="logo"><span class="s">S</span>iansa</div>
  <div id="splash-note">Connecting…</div>

<audio id="audio"></audio>
<!-- The phone's own stream while casting gaplessly (issue #114): played here, not through Google's Cast player, which
     never got past 0 s with an endless stream on a SHIELD (0.52.0-dev). -->
<audio id="live" preload="auto"></audio>
<script>
const ICONS = {
  play: '<path d="M8 5v14l11-7z"/>',
  pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
  next: '<path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>',
  prev: '<path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>',
  forward: '<path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>',
  back: '<path d="M11 18V6l-8.5 6 8.5 6zm.5-6 8.5 6V6l-8.5 6z"/>',
};
const $ = id => document.getElementById(id);

const context = cast.framework.CastReceiverContext.getInstance();

// What happens here goes to the phone's log ("CastTV"), for tracing problems: the keys the page gets, the TV's own
// seeks and what the page made of them, the queues loaded, and songs that fail to play.
const LOG_NS = 'urn:x-cast:app.siansa.log';
function tvlog(text) {
  try { context.sendCustomMessage(LOG_NS, undefined, String(text)); } catch (e) { /* no phone listening yet */ }
}
// Gapless through the phone (issue #114): the phone plays the queue itself and sends its mix here as one endless
// stream; this page plays that in its own <audio> when the phone says start (on LIVE_NS: start, stop, now), shows the
// song the phone says and sends the remote's keys there. It tells
// the phone where the stream is, so the phone writes only so far ahead and shows what plays here.
const LIVE_NS = 'urn:x-cast:app.siansa.live';
let live = null;      // {stream: n, format} while playing the phone's stream, in the page's own <audio id="live">
let liveNow = null;   // the phone's last word on the song: title, artist, album, cover, positionMs, durationMs, playing
let liveAt = 0;       // when it came (Date.now())
let liveWaiting = false;
// The page closes itself after 5 minutes with nothing playing (Google's own idle timeout is off: see below).
const IDLE_CLOSE_MS = 5 * 60 * 1000;
let idleSince = Date.now();
function liveSend(obj) {
  try { context.sendCustomMessage(LIVE_NS, undefined, obj); } catch (e) { /* the phone isn't listening yet */ }
}

// A mistake in this page is logged rather than lost.
window.addEventListener('error', e => tvlog('page error: ' + (e.message || e.type)));
window.addEventListener('unhandledrejection', e => tvlog('page error: ' + (e.reason && e.reason.message || e.reason)));
const player = context.getPlayerManager();
player.setMediaElement($('audio'));

function fmt(s) {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function showNow(show) {
  $('now').classList.toggle('hidden', !show);
  $('splash').classList.toggle('hidden', show);
}

// What the splash says: connecting, then waiting for a song, then the queue's end.
let played = false;
let failed = false;
function note() {
  if (failed) return 'This song couldn\u2019t play. Pick another on your phone.';
  if (played) return 'Nothing playing. Pick a song on your phone.';
  return 'Connected. Pick a song on your phone.';
}

// A sign over the cover: what the remote just did. Paused keeps its sign; the others fade after a moment.
let signTimer = 0;
function sign(name, stay) {
  clearTimeout(signTimer);
  $('sign-icon').innerHTML = ICONS[name];
  $('sign').classList.add('on');
  if (!stay) signTimer = setTimeout(() => {
    if ($('now').classList.contains('paused')) sign('pause', true); else $('sign').classList.remove('on');
  }, 900);
}

function render() {
  const media = player.getMediaInformation();
  const state = player.getPlayerState();
  const S = cast.framework.messages.PlayerState;
  const phone = !!(live && liveNow && liveNow.title !== undefined);
  if (!phone && (live || !media || state === S.IDLE)) { $('splash-note').textContent = note(); showNow(false); return; }
  played = true;
  failed = false;
  showNow(true);
  const paused = phone ? !liveNow.playing : state === S.PAUSED;
  const was = $('now').classList.contains('paused');
  $('now').classList.toggle('paused', paused);
  if (paused && !was) sign('pause', true);
  if (!paused && was) sign('play');
  const m = phone ? { title: liveNow.title, artist: liveNow.artist, albumName: liveNow.album,
    images: liveNow.cover ? [{ url: liveNow.cover }] : [] } : (media.metadata || {});
  $('title').textContent = m.title || '';
  $('artist').textContent = m.artist || m.albumArtist || '';
  $('album').textContent = m.albumName || '';
  const art = m.images && m.images.length ? m.images[0].url : '';
  const bg = art ? 'url("' + art.replace(/["\\\n\r]/g, encodeURIComponent) + '")' : '';
  $('cover').classList.toggle('none', !art);
  if ($('cover').dataset.art !== art) {
    $('cover').dataset.art = art;
    $('cover').style.backgroundImage = bg;
    $('backdrop').style.backgroundImage = bg;
  }
  $('spinner').classList.toggle('hidden', phone ? !(liveWaiting && liveNow.playing) : state !== S.BUFFERING);
}

// Where the song is: the TV's own player, or, playing the phone's stream, what the phone said, on by this clock.
function livePos() {
  if (!liveNow) return 0;
  const dur = liveNow.durationMs / 1000;
  let pos = liveNow.positionMs / 1000 + (liveNow.playing && !liveWaiting ? (Date.now() - liveAt) / 1000 : 0);
  return dur > 0 ? Math.min(pos, dur) : pos;
}

function tick() {
  const pos = live ? (windTo !== null ? windTo : livePos()) : player.getCurrentTimeSec();
  const dur = live ? (liveNow ? liveNow.durationMs / 1000 : 0) : player.getDurationSec();
  $('pos').textContent = fmt(pos);
  $('dur').textContent = fmt(dur);
  $('fill').style.width = dur > 0 ? Math.min(100, pos / dur * 100) + '%' : '0';
}

const E = cast.framework.events.EventType;
[E.PLAYER_LOAD_COMPLETE, E.PLAYING, E.PAUSE, E.BUFFERING, E.MEDIA_STATUS, E.MEDIA_FINISHED, E.ENDED, E.ABORT]
  .forEach(t => player.addEventListener(t, render));
setInterval(tick, 500);

// The remote: a press of left or right goes to the previous or next song, holding it winds back or forward
// through the song (faster the longer it's held), OK plays and pauses, and the media keys do what they say.
// A press is told from a hold by the key repeating: a held key sends repeats after about half a second. A press
// acts when the key is let go, or 600 ms after it if the TV never says so.
let lastAct = 0;
let arrowAt = 0;  // the last left or right, from a key or from the TV's seeks
let keyAt = 0;    // the last left or right that reached the page as a key
function jump(by) {
  const req = new cast.framework.messages.QueueUpdateRequestData();
  req.jump = by;
  player.sendLocalMediaRequest(req);
}
function act(name) {
  const now = Date.now();
  if (now - lastAct < 600) { tvlog('ignored ' + name + ' (just did one)'); return; }
  tvlog('does ' + name);
  lastAct = now;
  if (live) {
    // The phone is the player: it does what the remote asks (previous goes back to the song's start after its first
    // seconds, as on the phone), and says so.
    if (name === 'next' || name === 'prev') sign(name);
    liveSend({ type: 'command', action: name });
    return;
  }
  const S = cast.framework.messages.PlayerState;
  if (name === 'toggle') name = player.getPlayerState() === S.PAUSED ? 'play' : 'pause';
  if (name === 'play') player.play();
  if (name === 'pause') player.pause();
  if (name === 'next') { sign('next'); jump(1); }
  // Previous goes back to the start of the song after its first 5 seconds, else to the song before.
  if (name === 'prev') { sign('prev'); player.getCurrentTimeSec() > 5 ? seekTo(0) : jump(-1); }
}

// Winding: steps of 5 s, then 10 s after two seconds held, then 20 s after five.
let windStart = 0;
let windAt = 0;
let windTo = null;   // where the last step went: the player's time lags behind a seek
let ownSeekAt = 0;   // the page's own seeks pass the seek interceptor below
function seekTo(sec) { ownSeekAt = Date.now(); player.seek(sec); }
function wind(dir) {
  const now = Date.now();
  if (!windStart) windStart = now;
  if (now - windAt < 200) return;
  windAt = now;
  const held = now - windStart;
  const step = held > 5000 ? 20 : held > 2000 ? 10 : 5;
  const dur = live ? (liveNow ? liveNow.durationMs / 1000 : 0) : player.getDurationSec();
  let to = (windTo !== null ? windTo : (live ? livePos() : player.getCurrentTimeSec())) + dir * step;
  to = Math.max(0, dur > 0 ? Math.min(dur - 1, to) : to);
  sign(dir < 0 ? 'back' : 'forward');
  tvlog('winds to ' + Math.round(to) + ' s');
  windTo = to;
  // Playing the phone's stream, every seek starts a new stream: the bar shows where it'll go, and the phone is
  // asked once the key is let go.
  if (!live) seekTo(to);
  tick();
}

// Winding ended: playing the phone's stream, the phone now moves to where the winding got to.
function windDone() {
  if (live && windTo !== null) {
    tvlog('asks the phone to go to ' + Math.round(windTo) + ' s');
    liveSend({ type: 'command', action: 'seek', toMs: Math.round(windTo * 1000) });
    if (liveNow) { liveNow.positionMs = windTo * 1000; liveAt = Date.now(); }
  }
}

// One arrow at a time: which way, whether it's being held, and the timer that settles a press.
// A hold is a second key-down the same way before the key comes up: Google TV repeats the key-down while it's held
// without marking it as a repeat (0.52.0-dev, the owner's SHIELD), so the repeat flag alone isn't enough.
let arrow = 0;
let holding = false;
let settle = 0;
function arrowDone() {
  clearTimeout(settle);
  if (arrow && !holding) act(arrow < 0 ? 'prev' : 'next');
  if (holding) { tvlog('stopped winding'); windDone(); }
  arrow = 0;
  holding = false;
  windStart = 0;
  windTo = null;
}
function arrowDown(dir, repeat) {
  arrowAt = Date.now();
  if (dir !== arrow) { if (arrow) arrowDone(); arrow = dir; holding = false; if (repeat) { holding = true; wind(dir); } }
  else { holding = true; wind(dir); }
  clearTimeout(settle);
  // No key-up from some TVs: a press settles 600 ms after the last key event.
  settle = setTimeout(arrowDone, 600);
}

// OK and the play/pause keys: Google TV plays or pauses by itself as well (a PLAY or PAUSE request a few ms after the
// key), so doing it here too paused and played again at once. The page waits a moment and only acts when the TV
// didn't.
let pending = 0;
function later(name) {
  clearTimeout(pending);
  pending = setTimeout(() => { pending = 0; act(name); }, 350);
}
function tvDidIt() {
  if (!pending) return;
  clearTimeout(pending);
  pending = 0;
  tvlog('the TV played or paused itself');
}

const KEYS = { 37: 'ArrowLeft', 39: 'ArrowRight', 13: 'Enter', 179: 'MediaPlayPause', 176: 'MediaTrackNext',
  177: 'MediaTrackPrevious', 415: 'MediaPlay', 19: 'MediaPause', 417: 'MediaTrackNext', 412: 'MediaTrackPrevious' };
const keyOf = e => e.key && e.key !== 'Unidentified' ? e.key : KEYS[e.keyCode];
document.addEventListener('keydown', e => {
  tvlog('key down ' + e.key + ' (' + e.keyCode + ')' + (e.repeat ? ' repeat' : ''));
  if ($('now').classList.contains('hidden')) return;
  switch (keyOf(e)) {
    case 'ArrowLeft': keyAt = Date.now(); arrowDown(-1, e.repeat); break;
    case 'ArrowRight': keyAt = Date.now(); arrowDown(1, e.repeat); break;
    case 'MediaTrackPrevious': act('prev'); break;
    case 'MediaTrackNext': act('next'); break;
    case 'MediaRewind': wind(-1); break;
    case 'MediaFastForward': wind(1); break;
    case 'Enter': case ' ': case 'MediaPlayPause': later('toggle'); break;
    case 'MediaPlay': later('play'); break;
    case 'MediaPause': later('pause'); break;
    default: return;
  }
  e.preventDefault();
});
document.addEventListener('keyup', e => {
  tvlog('key up ' + e.key + ' (' + e.keyCode + ')');
  const key = keyOf(e);
  if ((key === 'ArrowLeft' && arrow < 0) || (key === 'ArrowRight' && arrow > 0)) { arrowAt = Date.now(); arrowDone(); }
  if (key === 'MediaRewind' || key === 'MediaFastForward') { windStart = 0; windDone(); windTo = null; }
});

// Lossless quality: Siansa sends an MP3 320 stream, plus in customData the address and type of the original file for
// files every Cast device plays (FLAC, MP3, Ogg, WAV, AAC), or of the server's FLAC conversion for lossless files
// it can't (ALAC, .m4a, Monkey's Audio…; marked "converted"). The TV plays that. If it can't, the queue reloads as MP3,
// and later songs of the same kind (originals, or conversions) go straight to MP3. A conversion that fails usually
// means the server has no FLAC conversion: older Navidrome sends the ALAC file itself then, which the TV can't play.
// In MP3 320 quality nothing else is sent, and every song plays as MP3.
const M = cast.framework.messages;
let originalsFail = false;
let convertedFail = false;
let retrying = false;

const isConverted = media => !!(media && media.customData && media.customData.converted);
const kindFailed = media => isConverted(media) ? convertedFail : originalsFail;

// Returns whether the song goes as its original (or the server's FLAC conversion).
function useOriginal(media) {
  const c = media && media.customData;
  if (!c || !c.originalUrl || kindFailed(media)) return false;
  if (!c.mp3Url) c.mp3Url = media.contentUrl || media.contentId;
  media.contentUrl = c.originalUrl;
  media.contentType = c.originalType || 'audio/*';
  return true;
}

function useMp3(media) {
  const c = media && media.customData;
  if (!c || !c.mp3Url) return media;
  media.contentUrl = c.mp3Url;
  media.contentType = 'audio/mpeg';
  return media;
}

player.setMessageInterceptor(M.MessageType.LOAD, req => {
  idleSince = Date.now();
  // The page's own load of the phone's stream into Google's player.
  if (req.media && req.media.customData && req.media.customData.siansaLive) return req;
  if (live) stopLive('the queue is loading');
  try {
    const items = req.queueData && req.queueData.items || [];
    const originals = items.filter(i => useOriginal(i.media));
    const converted = originals.filter(i => isConverted(i.media)).length;
    useOriginal(req.media);
    tvlog('load from ' + (req.senderId || 'the TV') + ': ' + items.length + ' songs, starting at ' +
      ((req.queueData && req.queueData.startIndex || 0) + 1) + ', ' + (originals.length - converted) +
      ' as their original file, ' + converted + ' converted to FLAC by the server' +
      (originalsFail ? ' (originals failed before: MP3 instead)' : '') +
      (convertedFail ? ' (FLAC conversions failed before: MP3 instead)' : ''));
  } catch (e) { tvlog('load: ' + e.message); }
  return req;
});
player.setMessageInterceptor(M.MessageType.QUEUE_INSERT, req => {
  try {
    const items = req.items || [];
    const originals = items.filter(i => useOriginal(i.media));
    const converted = originals.filter(i => isConverted(i.media)).length;
    tvlog('queue insert: ' + items.length + ' songs, ' + (originals.length - converted) + ' as their original file, ' +
      converted + ' converted to FLAC');
  } catch (e) { tvlog('queue insert: ' + e.message); }
  return req;
});

function songOf(media) {
  const c = media && media.customData || {};
  return (c.siansaSongId || media && media.contentId || '?') + ' (' + (media && media.contentType || '?') +
    (c.converted ? ', converted by the server' : '') + ')';
}

// A song that can't play: the queue loads again from where it was, with that song and every other of its kind
// (originals, or the server's FLAC conversions) as MP3; once that kind is MP3, the splash says so. Nothing here may
// throw or leave the page waiting: the session must carry on either way.
player.addEventListener(E.ERROR, event => {
  if (live && live.cast) {
    tvlog('Google\u2019s player: error ' + (event && event.detailedErrorCode) + ' on the phone\u2019s stream ' + live.stream + ': ' + liveState());
    liveSend({ type: 'error', stream: live.stream, code: String(event && event.detailedErrorCode), message: String(event && event.reason || '') });
    return;
  }
  let media = null;
  try {
    media = player.getMediaInformation();
    tvlog('media error ' + (event && event.detailedErrorCode) + (event && event.reason ? ' (' + event.reason + ')' : '') +
      ' on ' + songOf(media) + (retrying ? ', while loading again as MP3' : ''));
    if (isConverted(media) && !convertedFail) tvlog('the server\u2019s FLAC conversion didn\u2019t play: does it have a "flac" transcoding? Playing these as MP3');
  } catch (e) { tvlog('media error: ' + e.message); }
  try {
    const queue = player.getQueueManager();
    const items = queue && queue.getItems();
    const converted = isConverted(media);
    if (retrying || !items || !items.length || !media || !media.customData || !media.customData.mp3Url || kindFailed(media)) {
      // Already MP3, or nothing to fall back to: say so on the splash instead of a silent screen.
      if (!retrying) { failed = true; render(); }
      return;
    }
    const req = new M.LoadRequestData();
    req.autoplay = true;
    req.currentTime = player.getCurrentTimeSec() || 0;
    req.queueData = new M.QueueData();
    req.queueData.items = items.filter(i => i && i.media).map(i => {
      const item = new M.QueueItem();
      // Only the failed kind goes as MP3; the other keeps playing as it was.
      item.media = isConverted(i.media) === converted ? useMp3(i.media) : i.media;
      item.customData = i.customData;
      return item;
    });
    if (!req.queueData.items.length) { failed = true; render(); return; }
    req.queueData.startIndex = Math.min(Math.max(0, queue.getCurrentItemIndex()), req.queueData.items.length - 1);
    req.media = req.queueData.items[req.queueData.startIndex].media;
    if (converted) convertedFail = true; else originalsFail = true;
    retrying = true;
    tvlog('playing the queue with ' + (converted ? 'FLAC conversions' : 'originals') + ' as MP3 instead: ' + req.queueData.items.length + ' songs, from song ' +
      (req.queueData.startIndex + 1) + ' at ' + Math.round(req.currentTime) + ' s');
    Promise.resolve(player.load(req))
      .catch(e => { tvlog('loading as MP3 failed: ' + (e && (e.message || e.type) || e)); failed = true; render(); })
      .finally(() => { retrying = false; });
  } catch (e) {
    retrying = false;
    failed = true;
    tvlog('falling back to MP3 failed: ' + e.message);
    try { render(); } catch (e2) { /* the splash stays as it was */ }
  }
});

// A relative seek ("a few seconds back or forward") comes from the TV's own remote handling, never from Siansa,
// which always seeks to a point in the song: take it as previous or next instead.
// A seek that arrives together with a left or right press is the TV's too, so it's dropped.
// They're handled like the keys: one on its own is a press (previous or next), several in a row are a hold
// (winding through the song).
player.setMessageInterceptor(M.MessageType.SEEK, req => {
  if (Date.now() - ownSeekAt < 200) return req;
  tvlog('seek from ' + (req.senderId || 'the TV') + ': to ' + req.currentTime + ', by ' + req.relativeTime + ', at ' + Math.round(player.getCurrentTimeSec()) + ' s');
  const relative = typeof req.relativeTime === 'number' && typeof req.currentTime !== 'number';
  if (relative) {
    // When the keys reach the page too, they already count: the TV's seek is dropped.
    // A second one the same way while the first is still settling is a hold.
    const dir = req.relativeTime < 0 ? -1 : 1;
    if (Date.now() - keyAt >= 1500) arrowDown(dir, arrow === dir);
    return null;
  }
  if (Date.now() - arrowAt < 1500) return null;
  // The phone's stream is live: a point in it means nothing to the song. Dropped.
  if (live) { tvlog('seek dropped: the phone\u2019s stream is live'); return null; }
  return req;
});

// Other commands, only logged: to see what the TV's remote sends besides keys and seeks.
// Playing the phone's stream, play, pause and the TV's own next and previous go to the phone instead, which plays and
// pauses this TV in turn.
[M.MessageType.PLAY, M.MessageType.PAUSE, M.MessageType.QUEUE_UPDATE, M.MessageType.STOP].forEach(type =>
  player.setMessageInterceptor(type, req => {
    tvlog(type + ' from ' + (req.senderId || 'the TV') + (req.jump ? ', jump ' + req.jump : ''));
    if (type === M.MessageType.PLAY || type === M.MessageType.PAUSE) tvDidIt();
    // Google's player stopping (the phone ending the queue, as it takes the music over) never touches the phone's
    // stream, which plays in its own element.
    // The page's own requests to Google's player (the phone's stream in it) go through as they are.
    if (Date.now() - ownCafAt < 1000) return req;
    if (live && type === M.MessageType.STOP) {
      if (!live.cast) { tvlog('STOP is for Google\u2019s player: the phone\u2019s stream ' + live.stream + ' plays on'); return req; }
      // The phone's stream plays in Google's player: stopping it is pausing the music.
      liveSend({ type: 'command', action: 'pause' });
      return null;
    }
    if (live && type === M.MessageType.PLAY) { liveSend({ type: 'command', action: 'play' }); return null; }
    if (live && type === M.MessageType.PAUSE) { liveSend({ type: 'command', action: 'pause' }); return null; }
    if (live && type === M.MessageType.QUEUE_UPDATE && req.jump) {
      liveSend({ type: 'command', action: req.jump > 0 ? 'next' : 'prev' });
      return null;
    }
    return req;
  }));

// The phone's stream plays in the page's own <audio id="live">, which Google's Cast player doesn't manage: started and
// stopped by the phone's messages, not by a LOAD.
const liveEl = $('live');
// The element the phone's stream plays in: the page's own, or Google's player's (the stream loaded into it by the page).
const cafEl = $('audio');
const media = () => (live && live.cast ? cafEl : liveEl);
// When the page itself last asked Google's player to play, pause or stop: those come through its interceptors too, and
// mustn't go back to the phone as the remote's.
let ownCafAt = 0;
function cafDo(what) {
  ownCafAt = Date.now();
  try { if (what === 'play') player.play(); else if (what === 'pause') player.pause(); else player.stop(); } catch (e) { tvlog('Google\u2019s player: ' + what + ' failed: ' + e.message); }
}

// How the element is doing, for the log: the time, how far it has data, and what it's waiting for.
function liveState() {
  const liveEl = media();
  const b = liveEl.buffered;
  const end = b && b.length ? b.end(b.length - 1) : 0;
  return 'at ' + (liveEl.currentTime || 0).toFixed(1) + ' s, data to ' + end.toFixed(1) + ' s, readyState ' + liveEl.readyState +
    ', networkState ' + liveEl.networkState + (liveEl.paused ? ', paused' : '') +
    (liveEl.error ? ', error ' + liveEl.error.code + ' ' + (liveEl.error.message || '') : '');
}

// Whether the phone's stream should play (the phone's word), and whether it has started. Until it has started, the
// phone saying "not playing" is ignored (its player can wait for the TV, or be taking the music over from it): pausing
// then stopped the stream from ever starting (0.52.0-dev: "play() was interrupted by a call to pause()" right after
// every start, on the SHIELD). The phone repeats its word every few seconds, so a real pause still arrives.
let liveWanted = true;
let liveStarted = false;
let liveDeferred = false;

function playLive(why) {
  const liveEl = media();
  if (!live || !liveWanted || !liveEl.paused) return;
  const n = live.stream;
  if (live.cast) {
    // Google's player plays it once it has loaded it; after that, play is asked of it.
    if (live.loaded) cafDo('play');
    return;
  }
  const p = liveEl.play();
  if (!p || !p.catch) return;
  p.catch(e => {
    // A newer stream (or a stop) took over: nothing to do.
    if (!live || live.stream !== n || liveEl.getAttribute('src') == null) return;
    const name = e && e.name || String(e);
    tvlog('the phone\u2019s stream ' + n + ' didn\u2019t play (' + why + '): ' + name + ' ' + (e && e.message || '') + '; ' + liveState());
    // Interrupted (a pause, a load): tried again in a moment while it should play.
    if (name === 'AbortError') setTimeout(() => playLive('again'), 300);
  });
}

function startLive(m) {
  const S = cast.framework.messages.PlayerState;
  // The TV was playing the queue: that stops (the phone plays it now).
  // (A stream of the phone's in Google's player before is replaced by the new load, or stopped for the page's own.)
  if (player.getPlayerState() !== S.IDLE && !(live && live.cast && m.player === 'cast')) cafDo('stop');
  // A stream in the page's own element before: emptied.
  if (liveEl.getAttribute('src') != null) { liveEl.pause(); liveEl.removeAttribute('src'); try { liveEl.load(); } catch (e) { /* empty */ } }
  live = { stream: m.stream || 0, format: m.format || '?', cast: m.player === 'cast', loaded: false };
  liveWaiting = false;
  liveWanted = true;
  liveStarted = false;
  liveDeferred = false;
  idleSince = Date.now();
  tvlog('plays the phone\u2019s stream ' + live.stream + ' (' + live.format + (live.cast ? ', through Google\u2019s player' : ', in its own player') + ')');
  if (live.cast) {
    // As Symfonium does on the SHIELD: a buffered stream of unknown length, loaded into Google's player.
    const req = new M.LoadRequestData();
    const info = new M.MediaInformation();
    info.contentId = m.url;
    info.contentUrl = m.url;
    info.contentType = m.mime || 'audio/flac';
    info.streamType = M.StreamType.BUFFERED;
    info.customData = { siansaLive: true, stream: live.stream };
    req.media = info;
    req.autoplay = true;
    const n = live.stream;
    ownCafAt = Date.now();
    Promise.resolve(player.load(req))
      .then(() => { if (live && live.stream === n) { live.loaded = true; tvlog('Google\u2019s player loaded the phone\u2019s stream ' + n + ': ' + liveState()); playLive('loaded'); } })
      .catch(e => {
        if (!live || live.stream !== n) return;
        tvlog('Google\u2019s player couldn\u2019t load the phone\u2019s stream ' + n + ': ' + (e && (e.type || e.message) || e));
        liveSend({ type: 'error', stream: n, code: 'load', message: String(e && (e.detailedErrorCode || e.reason || e.type) || '') });
      });
  } else {
    liveEl.src = m.url;
    playLive('start');
  }
  render();
}

function stopLive(why) {
  if (!live) return;
  tvlog('stops the phone\u2019s stream ' + live.stream + ': ' + why + '; ' + liveState());
  const wasCast = live.cast;
  live = null;
  liveNow = null;
  liveWaiting = false;
  if (wasCast) { if (!why.startsWith('the queue')) cafDo('stop'); }
  else {
    liveEl.pause();
    liveEl.removeAttribute('src');
    try { liveEl.load(); } catch (e) { /* already empty */ }
  }
  render();
}

// The phone's word: start or stop its stream, and the song with whether it plays (the element follows).
context.addCustomMessageListener(LIVE_NS, event => {
  const m = event.data || {};
  idleSince = Date.now();
  if (m.type === 'start' && m.url) { startLive(m); return; }
  if (m.type === 'stop') { stopLive('the phone stopped it'); return; }
  if (m.type !== 'now' || !live) return;
  liveNow = m;
  liveAt = Date.now();
  if (!holding) windTo = null;
  const was = liveWanted;
  if (m.playing || liveStarted) liveWanted = !!m.playing;
  else if (!liveDeferred) { liveDeferred = true; tvlog('the phone says not playing: left for now, the stream hasn\u2019t started'); }
  if (liveWanted && !was) tvlog('the phone plays');
  if (!liveWanted && was) tvlog('the phone pauses');
  if (liveWanted) playLive('the phone plays');
  else if (!media().paused) { if (live.cast) cafDo('pause'); else liveEl.pause(); }
  render();
  tick();
});

// Where the phone's stream is, for the phone: twice a second, and at once when it stops or starts moving.
function liveClock() {
  if (!live) return;
  const liveEl = media();
  const moving = !liveEl.paused && !liveWaiting && liveEl.readyState >= 3;
  liveSend({ type: 'clock', stream: live.stream, time: liveEl.currentTime || 0, moving: moving });
}
// The stream's events, from whichever element it plays in.
function onLive(type, f) {
  [liveEl, cafEl].forEach(el => el.addEventListener(type, e => { if (live && e.target === media()) f(e.target); }));
}
onLive('waiting', () => { liveWaiting = true; tvlog('waiting for the phone\u2019s stream: ' + liveState()); liveClock(); render(); });
onLive('stalled', () => tvlog('the phone\u2019s stream stalled: ' + liveState()));
onLive('error', el => {
  if (!live.cast && el.getAttribute('src') == null) return;
  // The phone decides: it tries another way, or hands this TV the queue.
  const err = el.error;
  tvlog('the phone\u2019s stream ' + live.stream + ' failed: ' + liveState());
  liveSend({ type: 'error', stream: live.stream, code: String(err ? err.code : '?'), message: String(err && err.message || '') });
});
onLive('timeupdate', el => {
  if (liveStarted || el.currentTime < 0.3) return;
  liveStarted = true;
  tvlog('the phone\u2019s stream ' + live.stream + ' has started: ' + liveState());
});
// Enough data now: play, if it should and isn't.
['loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough'].forEach(t => onLive(t, () => {
  if (t === 'canplay' || t === 'loadedmetadata') tvlog('the phone\u2019s stream: ' + t + ', ' + liveState());
  playLive(t);
}));
['playing', 'pause'].forEach(t => onLive(t, el => {
  if (t === 'playing') { if (liveWaiting || el.currentTime < 0.5) tvlog('the phone\u2019s stream plays: ' + liveState()); liveWaiting = false; }
  liveClock();
  render();
}));
setInterval(liveClock, 500);

// Nothing loaded in Google's player while the phone's stream plays: its own idle timeout (which closed this page, it
// seems: status 2161 on the phone, 0.52.0-dev) is off, and the page closes itself instead after 5 minutes with
// nothing playing at all, as the Cast player did.
// Any word from the phone, a stream or a queue counts as something happening: it can't close while one plays or
// within 5 minutes of one.
setInterval(() => {
  const S = cast.framework.messages.PlayerState;
  const busy = live || player.getPlayerState() !== S.IDLE;
  if (busy) { idleSince = Date.now(); return; }
  if (Date.now() - idleSince > IDLE_CLOSE_MS) {
    tvlog('nothing played for ' + Math.round((Date.now() - idleSince) / 60000) + ' minutes: closing');
    context.stop();
  }
}, 10000);

// Why the session ends, as far as the page sees it (2161 on the phone is the phone ending the cast itself: Play on ›
// This phone, or hold to stop).
const SE = cast.framework.system.EventType;
if (SE.SENDER_DISCONNECTED) context.addEventListener(SE.SENDER_DISCONNECTED, e => tvlog('the phone let go (' + (e && e.reason) + ')' + (live ? '; ' + liveState() : '')));
if (SE.SHUTDOWN) context.addEventListener(SE.SHUTDOWN, () => tvlog('the TV screen is closing' + (live ? '; ' + liveState() : '')));

// Previous and next work on the queue the phone sends (the whole queue, with the next song loaded ahead).
const options = new cast.framework.CastReceiverOptions();
options.statusText = 'Siansa';
options.customNamespaces = { [LOG_NS]: cast.framework.system.MessageType.STRING, [LIVE_NS]: cast.framework.system.MessageType.JSON };
options.supportedCommands = M.Command.ALL_BASIC_MEDIA | M.Command.QUEUE_NEXT | M.Command.QUEUE_PREV;
options.disableIdleTimeout = true;
// The splash says "Connecting…" until the TV has started the page, then waits for the phone's first song.
context.addEventListener(cast.framework.system.EventType.READY, render);
context.start(options);
</script>
</body>
</html>
