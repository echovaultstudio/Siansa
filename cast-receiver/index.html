<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Siansa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Siansa's TV screen while casting (issue #114). The only outside file is Google's Cast receiver library. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root {
    /* Siansa's colours, as the app's icon and siansa.app: black, frost and amber. The same page serves Siansa and
       Siansa Dev, so it never takes the Dev build's purple. */
    --page: #000000; --raised: #12171C; --text: #EEF2F5; --muted: #AFC2D3; --frost: #9DB4C8;
    --amber: #FFB547; --mid-top: #FFE7C4; --mid-bottom: #E8A55A;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--page); color: var(--text);
    font-family: "Google Sans", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .screen { position: absolute; inset: 0; transition: opacity .6s ease; }
  .hidden { opacity: 0; pointer-events: none; }
  /* Sizes are in vh, so the page looks the same on TVs that draw it at 1280x720 and at 1920x1080. Everything stays
     inside the TV's safe area (5% at each edge), where some TVs cut the picture. */

  /* Splash: shown when the TV connects and while nothing is loaded. */
  #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vh; }
  .icon { width: 30vh; height: 30vh; }
  .logo { font-size: 6.7vh; font-weight: 750; letter-spacing: -.17vh; }
  /* The wordmark: Siansa with its S in the amber of the icon's middle bar, as on siansa.app. */
  .s { background: linear-gradient(180deg, var(--mid-top), var(--mid-bottom)); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  #splash-note { font-size: 2.8vh; color: var(--muted); }

  /* Now playing: the cover, the song, a thin line for where it is. No buttons: the remote's left and right go to
     the previous and next song, OK plays and pauses. */
  #backdrop { position: absolute; inset: -8vh; background-size: cover; background-position: center;
    filter: blur(8vh) brightness(.28) saturate(1.2); transition: background-image .8s ease; }
  #shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.15), rgba(0,0,0,.55)); }
  #player { display: flex; align-items: center; gap: 8vh; padding: 0 11vh; }
  #cover { position: relative; width: 58vh; height: 58vh; flex: none; border-radius: 1.6vh; overflow: hidden;
    background: var(--raised) center/cover; box-shadow: 0 3vh 8vh rgba(0,0,0,.55); }
  #cover.none { background-image: none; }
  #info { position: relative; flex: 1; min-width: 0; }
  #title { font-size: 7vh; font-weight: 700; line-height: 1.08; letter-spacing: -.12vh; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  #artist { font-size: 3.6vh; margin-top: 2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album { font-size: 2.6vh; margin-top: .8vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { margin-top: 6vh; height: .5vh; border-radius: .25vh; background: rgba(255,255,255,.16); overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--mid-bottom), var(--amber)); transition: width .5s linear; }
  #times { display: flex; justify-content: space-between; font-size: 2vh; color: var(--muted); margin-top: 1.2vh;
    font-variant-numeric: tabular-nums; }
  /* Paused: the cover darkens under the pause sign (an overlay, so the sign itself stays bright). */
  #cover::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .4s ease; }
  .paused #cover::after { opacity: 1; }
  .paused #fill { background: var(--frost); }

  /* What the remote just did (pause, play, previous, next), shown briefly over the cover; paused stays. */
  #sign { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; }
  #sign svg { width: 13vh; height: 13vh; fill: var(--text); filter: drop-shadow(0 .6vh 2vh rgba(0,0,0,.6)); }
  #sign { opacity: 0; transition: opacity .3s ease; }
  #sign.on { opacity: 1; }
  #spinner { position: absolute; right: 2.2vh; bottom: 2.2vh; width: 4.4vh; height: 4.4vh; border-radius: 50%;
    border: .46vh solid rgba(255,255,255,.2); border-top-color: var(--amber); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Siansa in the corner, quietly. */
  #brand { position: absolute; right: 7vh; bottom: 5vh; display: flex; align-items: center; gap: 1vh; opacity: .75; }
  #brand .icon { width: 6.4vh; height: 6.4vh; }
  #brand .logo { font-size: 3vh; }
</style>
</head>

    <path d="M64,54.5a2,2 0 0,1 4,0v5a2,2 0 0,1 -4,0z" fill="url(#barFrost)"/>
  </svg>
  <div class="logo"><span class="s">S</span>iansa</div>
  <div id="splash-note">Connecting…</div>
</div>

<div id="now" class="screen hidden">
  <div id="backdrop"></div>
  <div id="shade"></div>
  <div id="player" class="screen">

    </div>
  </div>

      <linearGradient id="arcIn2" x1="0" y1="36.98" x2="0" y2="71.02" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#AFC2D3" stop-opacity=".303"/><stop offset=".5" stop-color="#AFC2D3" stop-opacity=".55"/><stop offset="1" stop-color="#AFC2D3" stop-opacity=".303"/></linearGradient>
      <linearGradient id="arcOut2" x1="0" y1="31.06" x2="0" y2="76.94" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#AFC2D3" stop-opacity=".132"/><stop offset=".5" stop-color="#AFC2D3" stop-opacity=".24"/><stop offset="1" stop-color="#AFC2D3" stop-opacity=".132"/></linearGradient>

      <linearGradient id="barAmber2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7C4"/><stop offset="1" stop-color="#E8A55A"/></linearGradient>

<audio id="audio"></audio>
<script>
const ICONS = {
  play: '<path d="M8 5v14l11-7z"/>',
  pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
  next: '<path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>',
  prev: '<path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>',
  forward: '<path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>',
  back: '<path d="M11 18V6l-8.5 6 8.5 6zm.5-6 8.5 6V6l-8.5 6z"/>',
};
const $ = id => document.getElementById(id);

const context = cast.framework.CastReceiverContext.getInstance();

// What the remote does here goes to the phone's log ("CastTV"), for tracing remote problems: the keys the page
// gets, the TV's own seeks, and what the page made of them.
const LOG_NS = 'urn:x-cast:app.siansa.log';
function tvlog(text) {
  try { context.sendCustomMessage(LOG_NS, undefined, String(text)); } catch (e) { /* no phone listening yet */ }
}
const player = context.getPlayerManager();
player.setMediaElement($('audio'));

function fmt(s) {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function showNow(show) {
  $('now').classList.toggle('hidden', !show);
  $('splash').classList.toggle('hidden', show);
}

// What the splash says: connecting, then waiting for a song, then the queue's end.
let played = false;
let failed = false;
function note() {
  if (failed) return 'This song couldn\u2019t play. Pick another on your phone.';
  if (played) return 'Nothing playing. Pick a song on your phone.';
  return 'Connected. Pick a song on your phone.';
}

// A sign over the cover: what the remote just did. Paused keeps its sign; the others fade after a moment.
let signTimer = 0;
function sign(name, stay) {
  clearTimeout(signTimer);
  $('sign-icon').innerHTML = ICONS[name];
  $('sign').classList.add('on');
  if (!stay) signTimer = setTimeout(() => {
    if ($('now').classList.contains('paused')) sign('pause', true); else $('sign').classList.remove('on');
  }, 900);
}

function render() {
  const media = player.getMediaInformation();
  const state = player.getPlayerState();
  const S = cast.framework.messages.PlayerState;
  if (!media || state === S.IDLE) { $('splash-note').textContent = note(); showNow(false); return; }
  played = true;
  failed = false;
  showNow(true);
  const paused = state === S.PAUSED;
  const was = $('now').classList.contains('paused');
  $('now').classList.toggle('paused', paused);
  if (paused && !was) sign('pause', true);
  if (!paused && was) sign('play');
  const m = media.metadata || {};
  $('title').textContent = m.title || '';
  $('artist').textContent = m.artist || m.albumArtist || '';
  $('album').textContent = m.albumName || '';
  const art = m.images && m.images.length ? m.images[0].url : '';
  const bg = art ? 'url("' + art.replace(/["\\\n\r]/g, encodeURIComponent) + '")' : '';
  $('cover').classList.toggle('none', !art);
  if ($('cover').dataset.art !== art) {
    $('cover').dataset.art = art;
    $('cover').style.backgroundImage = bg;
    $('backdrop').style.backgroundImage = bg;
  }
  $('spinner').classList.toggle('hidden', state !== S.BUFFERING);
}

function tick() {
  const pos = player.getCurrentTimeSec();
  const dur = player.getDurationSec();
  $('pos').textContent = fmt(pos);
  $('dur').textContent = fmt(dur);
  $('fill').style.width = dur > 0 ? Math.min(100, pos / dur * 100) + '%' : '0';
}

const E = cast.framework.events.EventType;
[E.PLAYER_LOAD_COMPLETE, E.PLAYING, E.PAUSE, E.BUFFERING, E.MEDIA_STATUS, E.MEDIA_FINISHED, E.ENDED, E.ABORT]
  .forEach(t => player.addEventListener(t, render));
setInterval(tick, 500);

// The remote: a press of left or right goes to the previous or next song, holding it winds back or forward
// through the song (faster the longer it's held), OK plays and pauses, and the media keys do what they say.
// A press is told from a hold by the key repeating: a held key sends repeats after about half a second. A press
// acts when the key is let go, or 600 ms after it if the TV never says so.
let lastAct = 0;
let arrowAt = 0;  // the last left or right, from a key or from the TV's seeks
let keyAt = 0;    // the last left or right that reached the page as a key
function jump(by) {
  const req = new cast.framework.messages.QueueUpdateRequestData();
  req.jump = by;
  player.sendLocalMediaRequest(req);
}
function act(name) {
  const now = Date.now();
  if (now - lastAct < 600) { tvlog('ignored ' + name + ' (just did one)'); return; }
  tvlog('does ' + name);
  lastAct = now;
  const S = cast.framework.messages.PlayerState;
  if (name === 'toggle') name = player.getPlayerState() === S.PAUSED ? 'play' : 'pause';
  if (name === 'play') player.play();
  if (name === 'pause') player.pause();
  if (name === 'next') { sign('next'); jump(1); }
  // Previous goes back to the start of the song after its first 5 seconds, else to the song before.
  if (name === 'prev') { sign('prev'); player.getCurrentTimeSec() > 5 ? player.seek(0) : jump(-1); }
}

// Winding: steps of 5 s, then 10 s after two seconds held, then 20 s after five.
let windStart = 0;
let windAt = 0;
function wind(dir) {
  const now = Date.now();
  if (!windStart) windStart = now;
  if (now - windAt < 200) return;
  windAt = now;
  const held = now - windStart;
  const step = held > 5000 ? 20 : held > 2000 ? 10 : 5;
  const dur = player.getDurationSec();
  let to = player.getCurrentTimeSec() + dir * step;
  to = Math.max(0, dur > 0 ? Math.min(dur - 1, to) : to);
  sign(dir < 0 ? 'back' : 'forward');
  tvlog('winds to ' + Math.round(to) + ' s');
  player.seek(to);
  tick();
}

// One arrow at a time: which way, whether it's being held, and the timer that settles a press.
let arrow = 0;
let holding = false;
let settle = 0;
function arrowDone() {
  clearTimeout(settle);
  if (arrow && !holding) act(arrow < 0 ? 'prev' : 'next');
  arrow = 0;
  holding = false;
  windStart = 0;
}
function arrowDown(dir, repeat) {
  arrowAt = Date.now();
  if (dir !== arrow) { if (arrow) arrowDone(); arrow = dir; holding = false; }
  else if (repeat || holding) { holding = true; wind(dir); }
  clearTimeout(settle);
  // No key-up from some TVs: a press settles 600 ms after the last key event.
  settle = setTimeout(arrowDone, 600);
}

const KEYS = { 37: 'ArrowLeft', 39: 'ArrowRight', 13: 'Enter', 179: 'MediaPlayPause', 176: 'MediaTrackNext',
  177: 'MediaTrackPrevious', 415: 'MediaPlay', 19: 'MediaPause', 417: 'MediaTrackNext', 412: 'MediaTrackPrevious' };
const keyOf = e => e.key && e.key !== 'Unidentified' ? e.key : KEYS[e.keyCode];
document.addEventListener('keydown', e => {
  tvlog('key down ' + e.key + ' (' + e.keyCode + ')' + (e.repeat ? ' repeat' : ''));
  if ($('now').classList.contains('hidden')) return;
  switch (keyOf(e)) {
    case 'ArrowLeft': keyAt = Date.now(); arrowDown(-1, e.repeat); break;
    case 'ArrowRight': keyAt = Date.now(); arrowDown(1, e.repeat); break;
    case 'MediaTrackPrevious': act('prev'); break;
    case 'MediaTrackNext': act('next'); break;
    case 'MediaRewind': wind(-1); break;
    case 'MediaFastForward': wind(1); break;
    case 'Enter': case ' ': case 'MediaPlayPause': act('toggle'); break;
    case 'MediaPlay': act('play'); break;
    case 'MediaPause': act('pause'); break;
    default: return;
  }
  e.preventDefault();
});
document.addEventListener('keyup', e => {
  tvlog('key up ' + e.key + ' (' + e.keyCode + ')');
  const key = keyOf(e);
  if ((key === 'ArrowLeft' && arrow < 0) || (key === 'ArrowRight' && arrow > 0)) { arrowAt = Date.now(); arrowDone(); }
  if (key === 'MediaRewind' || key === 'MediaFastForward') windStart = 0;
});

// Original quality: siansa sends an MP3 320 stream plus the original file's address in customData.
// The TV plays the original (FLAC and so on). If it can't, the queue reloads as MP3 and later
// songs go straight to MP3.
const M = cast.framework.messages;
let originalsFail = false;
let retrying = false;

function useOriginal(media) {
  const c = media && media.customData;
  if (originalsFail || !c || !c.originalUrl) return;
  if (!c.mp3Url) c.mp3Url = media.contentUrl || media.contentId;
  media.contentUrl = c.originalUrl;
  media.contentType = c.originalType || 'audio/*';
}

function useMp3(media) {
  const c = media && media.customData;
  if (!c || !c.mp3Url) return media;
  media.contentUrl = c.mp3Url;
  media.contentType = 'audio/mpeg';
  return media;
}

player.setMessageInterceptor(M.MessageType.LOAD, req => {
  useOriginal(req.media);
  if (req.queueData && req.queueData.items) req.queueData.items.forEach(i => useOriginal(i.media));
  return req;
});
player.setMessageInterceptor(M.MessageType.QUEUE_INSERT, req => {
  (req.items || []).forEach(i => useOriginal(i.media));
  return req;
});

player.addEventListener(E.ERROR, () => {
  const queue = player.getQueueManager();
  const items = queue && queue.getItems();
  const media = player.getMediaInformation();
  if (originalsFail || retrying || !items || !items.length || !media || !media.customData || !media.customData.mp3Url) {
    // Already MP3, or nothing to fall back to: say so on the splash instead of a silent screen.
    if (!retrying) { failed = true; render(); }
    return;
  }
  originalsFail = true;
  retrying = true;
  const req = new M.LoadRequestData();
  req.autoplay = true;
  req.currentTime = player.getCurrentTimeSec() || 0;
  req.queueData = new M.QueueData();
  req.queueData.items = items.map(i => {
    const item = new M.QueueItem();
    item.media = useMp3(i.media);
    item.customData = i.customData;
    return item;
  });
  req.queueData.startIndex = Math.max(0, queue.getCurrentItemIndex());
  req.media = req.queueData.items[req.queueData.startIndex].media;
  player.load(req).finally(() => { retrying = false; });
});

// A relative seek ("a few seconds back or forward") comes from the TV's own remote handling, never from Siansa,
// which always seeks to a point in the song: take it as previous or next instead.
// A seek that arrives together with a left or right press is the TV's too, so it's dropped.
// They're handled like the keys: one on its own is a press (previous or next), several in a row are a hold
// (winding through the song).
player.setMessageInterceptor(M.MessageType.SEEK, req => {
  tvlog('seek from ' + (req.senderId || 'the TV') + ': to ' + req.currentTime + ', by ' + req.relativeTime + ', at ' + Math.round(player.getCurrentTimeSec()) + ' s');
  const relative = typeof req.relativeTime === 'number' && typeof req.currentTime !== 'number';
  if (relative) {
    // When the keys reach the page too, they already count: the TV's seek is dropped.
    // A second one the same way while the first is still settling is a hold.
    const dir = req.relativeTime < 0 ? -1 : 1;
    if (Date.now() - keyAt >= 1500) arrowDown(dir, arrow === dir);
    return null;
  }
  if (Date.now() - arrowAt < 1500) return null;
  return req;
});

// Other commands, only logged: to see what the TV's remote sends besides keys and seeks.
[M.MessageType.PLAY, M.MessageType.PAUSE, M.MessageType.QUEUE_UPDATE, M.MessageType.STOP].forEach(type =>
  player.setMessageInterceptor(type, req => { tvlog(type + ' from ' + (req.senderId || 'the TV') + (req.jump ? ', jump ' + req.jump : '')); return req; }));

// Previous and next work on the queue the phone sends (the whole queue, with the next song loaded ahead).
const options = new cast.framework.CastReceiverOptions();
options.statusText = 'Siansa';
options.customNamespaces = { [LOG_NS]: cast.framework.system.MessageType.STRING };
options.supportedCommands = M.Command.ALL_BASIC_MEDIA | M.Command.QUEUE_NEXT | M.Command.QUEUE_PREV;
// The splash says "Connecting…" until the TV has started the page, then waits for the phone's first song.
context.addEventListener(cast.framework.system.EventType.READY, render);
context.start(options);
</script>
</body>
</html>
