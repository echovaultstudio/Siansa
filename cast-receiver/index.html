<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Siansa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Siansa's TV screen while casting (issue #114). The only outside file is Google's Cast receiver library. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root {
    --amber: #FFB547; --violet: #B69CFF; --plum: #110D1C; --plum-raised: #1C1630;
    --text: #EDE7F6; --muted: #B9B0CC;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--plum); color: var(--text);
    font-family: "Google Sans", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .screen { position: absolute; inset: 0; transition: opacity .6s ease; }
  .hidden { opacity: 0; pointer-events: none; }

  /* Splash: shown when the TV connects and while nothing is loaded. */
  /* Sizes are in vh, so the page looks the same on TVs that draw it at 1280x720 and at 1920x1080. */
  #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vh;
    background: var(--plum); }
  .icon { width: 24vh; height: 17.6vh; }
  .logo { font-size: 6.7vh; font-weight: 700; letter-spacing: -.1vh; }
  #splash-note { font-size: 2.8vh; color: var(--muted); }

  /* Now playing */
  #backdrop { position: absolute; inset: -6vh; background-size: cover; background-position: center;
    filter: blur(6vh) brightness(.35) saturate(1.3); transition: background-image .8s ease; }
  /* Kept inside the TV's safe area (5% at each edge), where some TVs cut the picture. */
  #player { display: flex; align-items: center; gap: 7.4vh; padding: 5vh 11vh; }
  #cover { position: relative; width: 52vh; height: 52vh; flex: none; border-radius: 2.2vh;
    background: var(--plum-raised) center/cover; box-shadow: 0 2.8vh 7.4vh rgba(0,0,0,.6); }
  #cover.none { background-image: none; }
  #info { position: relative; flex: 1; min-width: 0; }
  #device { font-size: 2vh; letter-spacing: .3vh; color: var(--amber); text-transform: uppercase; margin-bottom: 2.2vh; }
  #title { font-size: 6.7vh; font-weight: 700; line-height: 1.1; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  #artist { font-size: 3.5vh; margin-top: 1.7vh; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album { font-size: 2.8vh; margin-top: .7vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { margin-top: 5.2vh; height: .74vh; border-radius: .37vh; background: rgba(255,255,255,.18); overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--amber); }
  #times { display: flex; justify-content: space-between; font-size: 2.2vh; color: var(--muted); margin-top: 1.1vh; }
  .paused #fill { background: var(--violet); }
  .paused #cover { filter: brightness(.7); }

  #controls { display: flex; align-items: center; gap: 3.7vh; margin-top: 3.7vh; }
  .btn { width: 8.9vh; height: 8.9vh; border-radius: 50%; border: .28vh solid transparent; background: rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: center; transition: transform .15s, border-color .15s, background .15s; }
  .btn svg { width: 4.4vh; height: 4.4vh; fill: var(--text); }
  .btn.main { width: 11.9vh; height: 11.9vh; background: var(--amber); }
  .btn.main svg { width: 5.9vh; height: 5.9vh; fill: #2A1700; }
  .btn.focus { border-color: var(--text); transform: scale(1.12); }
  #hint { font-size: 2vh; color: var(--muted); margin-top: 2.6vh; }
  #spinner { position: absolute; right: 2.2vh; bottom: 2.2vh; width: 4.4vh; height: 4.4vh; border-radius: 50%;
    border: .46vh solid rgba(255,255,255,.2); border-top-color: var(--amber); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="splash" class="screen">
  <!-- Same as the phone app's launch screen: the launcher icon's sound bars on plum. -->
  <svg class="icon" viewBox="27 34 58 42">
    <path fill="#B9A4FF" d="M33,62a3,3 0 0,1 6,0v8a3,3 0 0,1 -6,0z"/>
    <path fill="#C9B8FF" d="M43,50a3,3 0 0,1 6,0v20a3,3 0 0,1 -6,0z"/>
    <path fill="#FFD38A" d="M53,40a3,3 0 0,1 6,0v30a3,3 0 0,1 -6,0z"/>
    <path fill="#C9B8FF" d="M63,48a3,3 0 0,1 6,0v22a3,3 0 0,1 -6,0z"/>
    <path fill="#B9A4FF" d="M73,58a3,3 0 0,1 6,0v12a3,3 0 0,1 -6,0z"/>
  </svg>
  <div class="logo">Siansa</div>
  <div id="splash-note">Connecting…</div>
</div>

<div id="now" class="screen hidden">
  <div id="backdrop"></div>
  <div id="player" class="screen">
    <div id="cover"><div id="spinner" class="hidden"></div></div>
    <div id="info">
      <div id="device">Playing on this TV</div>
      <div id="title"></div>
      <div id="artist"></div>
      <div id="album"></div>
      <div id="bar"><div id="fill"></div></div>
      <div id="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
      <div id="controls">
        <div class="btn" data-act="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></div>
        <div class="btn main focus" data-act="toggle"><svg id="toggle-icon" viewBox="0 0 24 24"></svg></div>
        <div class="btn" data-act="next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></div>
      </div>
      <div id="hint">Use the arrows and OK on your remote, or control it from your phone.</div>
    </div>
  </div>
</div>

<!-- CAF plays through this element; the page draws its own controls. -->
<audio id="audio"></audio>

<script>
const PLAY = '<path d="M8 5v14l11-7z"/>';
const PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
const $ = id => document.getElementById(id);

const context = cast.framework.CastReceiverContext.getInstance();
const player = context.getPlayerManager();
player.setMediaElement($('audio'));

function fmt(s) {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function showNow(show) {
  $('now').classList.toggle('hidden', !show);
  $('splash').classList.toggle('hidden', show);
}

// What the splash says: connecting, then waiting for a song, then the queue's end.
let played = false;
let failed = false;
function note() {
  if (failed) return 'This song couldn\u2019t play. Pick another on your phone.';
  if (played) return 'Nothing playing. Pick a song on your phone.';
  return 'Connected. Pick a song on your phone.';
}

function render() {
  const media = player.getMediaInformation();
  const state = player.getPlayerState();
  const S = cast.framework.messages.PlayerState;
  if (!media || state === S.IDLE) { $('splash-note').textContent = note(); showNow(false); return; }
  played = true;
  failed = false;
  showNow(true);
  const paused = state === S.PAUSED;
  $('now').classList.toggle('paused', paused);
  $('device').textContent = paused ? 'Paused' : state === S.BUFFERING ? 'Loading' : 'Playing on this TV';
  const m = media.metadata || {};
  $('title').textContent = m.title || '';
  $('artist').textContent = m.artist || m.albumArtist || '';
  $('album').textContent = m.albumName || '';
  const art = m.images && m.images.length ? m.images[0].url : '';
  const bg = art ? 'url("' + art.replace(/["\\\n\r]/g, encodeURIComponent) + '")' : '';
  $('cover').classList.toggle('none', !art);
  if ($('cover').dataset.art !== art) {
    $('cover').dataset.art = art;
    $('cover').style.backgroundImage = bg;
    $('backdrop').style.backgroundImage = bg;
  }
  $('toggle-icon').innerHTML = state === S.PLAYING || state === S.BUFFERING ? PAUSE : PLAY;
  $('spinner').classList.toggle('hidden', state !== S.BUFFERING);
}

function tick() {
  const pos = player.getCurrentTimeSec();
  const dur = player.getDurationSec();
  $('pos').textContent = fmt(pos);
  $('dur').textContent = fmt(dur);
  $('fill').style.width = dur > 0 ? Math.min(100, pos / dur * 100) + '%' : '0';
}

const E = cast.framework.events.EventType;
[E.PLAYER_LOAD_COMPLETE, E.PLAYING, E.PAUSE, E.BUFFERING, E.MEDIA_STATUS, E.MEDIA_FINISHED, E.ENDED, E.ABORT]
  .forEach(t => player.addEventListener(t, render));
setInterval(tick, 500);

// Remote control: left/right move between buttons, OK presses the focused one,
// media keys (play/pause, next, previous) work directly.
const buttons = [...document.querySelectorAll('.btn')];
let focus = 1;
function setFocus(i) {
  focus = Math.max(0, Math.min(buttons.length - 1, i));
  buttons.forEach((b, j) => b.classList.toggle('focus', j === focus));
}
function jump(by) {
  const req = new cast.framework.messages.QueueUpdateRequestData();
  req.jump = by;
  player.sendLocalMediaRequest(req);
}
function act(name) {
  const S = cast.framework.messages.PlayerState;
  if (name === 'toggle') player.getPlayerState() === S.PAUSED ? player.play() : player.pause();
  if (name === 'next') jump(1);
  if (name === 'prev') player.getCurrentTimeSec() > 5 ? player.seek(0) : jump(-1);
}
// On Google TV the remote's play/pause, next and previous reach the page through the TV's media controls, which
// Cast turns into the same commands the phone sends (see supportedCommands below). Keys the TV hands the page
// itself are handled here; older TVs give only key codes.
const KEYS = { 37: 'ArrowLeft', 39: 'ArrowRight', 13: 'Enter', 179: 'MediaPlayPause', 176: 'MediaTrackNext',
  177: 'MediaTrackPrevious', 415: 'MediaPlay', 19: 'MediaPause', 417: 'MediaTrackNext', 412: 'MediaTrackPrevious' };
document.addEventListener('keydown', e => {
  if ($('now').classList.contains('hidden')) return;
  const key = e.key && e.key !== 'Unidentified' ? e.key : KEYS[e.keyCode];
  const S = cast.framework.messages.PlayerState;
  switch (key) {
    case 'ArrowLeft': setFocus(focus - 1); break;
    case 'ArrowRight': setFocus(focus + 1); break;
    case 'Enter': case ' ': act(buttons[focus].dataset.act); break;
    case 'MediaPlayPause': act('toggle'); break;
    case 'MediaPlay': if (player.getPlayerState() === S.PAUSED) player.play(); break;
    case 'MediaPause': player.pause(); break;
    case 'MediaTrackNext': act('next'); break;
    case 'MediaTrackPrevious': act('prev'); break;
    default: return;
  }
  e.preventDefault();
});

// Original quality: siansa sends an MP3 320 stream plus the original file's address in customData.
// The TV plays the original (FLAC and so on). If it can't, the queue reloads as MP3 and later
// songs go straight to MP3.
const M = cast.framework.messages;
let originalsFail = false;
let retrying = false;

function useOriginal(media) {
  const c = media && media.customData;
  if (originalsFail || !c || !c.originalUrl) return;
  if (!c.mp3Url) c.mp3Url = media.contentUrl || media.contentId;
  media.contentUrl = c.originalUrl;
  media.contentType = c.originalType || 'audio/*';
}

function useMp3(media) {
  const c = media && media.customData;
  if (!c || !c.mp3Url) return media;
  media.contentUrl = c.mp3Url;
  media.contentType = 'audio/mpeg';
  return media;
}

player.setMessageInterceptor(M.MessageType.LOAD, req => {
  useOriginal(req.media);
  if (req.queueData && req.queueData.items) req.queueData.items.forEach(i => useOriginal(i.media));
  return req;
});
player.setMessageInterceptor(M.MessageType.QUEUE_INSERT, req => {
  (req.items || []).forEach(i => useOriginal(i.media));
  return req;
});

player.addEventListener(E.ERROR, () => {
  const queue = player.getQueueManager();
  const items = queue && queue.getItems();
  const media = player.getMediaInformation();
  if (originalsFail || retrying || !items || !items.length || !media || !media.customData || !media.customData.mp3Url) {
    // Already MP3, or nothing to fall back to: say so on the splash instead of a silent screen.
    if (!retrying) { failed = true; render(); }
    return;
  }
  originalsFail = true;
  retrying = true;
  const req = new M.LoadRequestData();
  req.autoplay = true;
  req.currentTime = player.getCurrentTimeSec() || 0;
  req.queueData = new M.QueueData();
  req.queueData.items = items.map(i => {
    const item = new M.QueueItem();
    item.media = useMp3(i.media);
    item.customData = i.customData;
    return item;
  });
  req.queueData.startIndex = Math.max(0, queue.getCurrentItemIndex());
  req.media = req.queueData.items[req.queueData.startIndex].media;
  player.load(req).finally(() => { retrying = false; });
});

// Previous and next work on the queue the phone sends (the whole queue, with the next song loaded ahead).
const options = new cast.framework.CastReceiverOptions();
options.statusText = 'Siansa';
options.supportedCommands = M.Command.ALL_BASIC_MEDIA | M.Command.QUEUE_NEXT | M.Command.QUEUE_PREV;
// The splash says "Connecting…" until the TV has started the page, then waits for the phone's first song.
context.addEventListener(cast.framework.system.EventType.READY, render);
context.start(options);
</script>
</body>
</html>
