# Weekly pull requests for outdated dependencies, and alerts for known vulnerabilities in them.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Related libraries arrive together, so each pull request can build on its own.
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp"]
      coil:
        patterns: ["io.coil-kt*"]
    ignore:
      # A new major version of the Android build plugin needs build-script changes; done by hand.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      # Media3 must match the FFmpeg decoder build (org.jellyfin.media3); both are updated by hand.
      - dependency-name: "androidx.media3:*"
      - dependency-name: "org.jellyfin.media3:*"
      # Newer releases need Android SDK 37 and Android Gradle Plugin 9; unblocked by that migration.
      - dependency-name: "androidx.compose:compose-bom"
      - dependency-name: "androidx.core:*"
      - dependency-name: "androidx.navigation:*"
      - dependency-name: "io.coil-kt.coil3:*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
