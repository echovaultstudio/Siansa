name: Device tests

# Runs the app on an Android emulator against a real Navidrome with a test library, behind a link
# limited to 4.3 Mbit/s like a phone's connection to a home server.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Start Navidrome with the test library
        run: scripts/test-server.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator diagnostics
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "::notice::SDK $SDK, emulator $($SDK/emulator/emulator -version 2>&1 | head -1)"
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager "system-images;android-33;aosp_atd;x86_64" > /dev/null
          echo no | $SDK/cmdline-tools/latest/bin/avdmanager create avd -n diag -k "system-images;android-33;aosp_atd;x86_64" -d pixel_6 --force > /dev/null
          ( timeout 120 $SDK/emulator/emulator -avd diag -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim > emu.txt 2>&1 ) || true
          grep -iE "error|fatal|fail|cannot|crash|kvm|accel|boot completed" emu.txt | head -15 | while IFS= read -r line; do echo "::warning::emu: $line"; done
          tail -5 emu.txt | while IFS= read -r line; do echo "::warning::emu tail: $line"; done
          $SDK/emulator/emulator -accel-check 2>&1 | tail -3 | while IFS= read -r line; do echo "::notice::accel: $line"; done

      - name: Run tests on a managed emulator
        run: |
          set -o pipefail
          gradle :app:ciPhoneDebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20 \
            -Pandroid.testInstrumentationRunnerArguments.navidromeUrl=http://10.0.2.2:5533 2>&1 | tee gradle.txt
          
      # Results as annotations, so they can be read without downloading logs.
      - name: Test output
        if: always()
        run: |
          grep -A8 "What went wrong" gradle.txt 2>/dev/null | head -12 | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done || true
          grep -E "Tests? .*(passed|failed)|BUILD (SUCCESSFUL|FAILED)" gradle.txt 2>/dev/null | tail -3 | while IFS= read -r line; do echo "::notice::$line"; done || true
          find app/build/outputs -iname "logcat*.txt" -exec cat {} + > logcat.txt 2>/dev/null || true
          grep -h "System.out" logcat.txt 2>/dev/null | grep -E "Kinds:|drawable:|setup|Cover|Stream|Audio|Waited" | sed 's/.*System.out: //' | head -60 | while IFS= read -r line; do echo "::notice::$line"; done || true
          for f in $(find app/build/outputs/androidTest-results -name "*.xml"); do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              fail = case.find("failure")
              name = case.get("name")
              if fail is not None:
                  msg = (fail.get("message") or fail.text or "").replace("\n", " ")[:400]
                  print(f"::error::FAILED {name}: {msg}")
              else:
                  print(f"::notice::PASSED {name} ({case.get('time')}s)")
          PY
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            logcat.txt
            ${{ runner.temp }}/navidrome-test/*.log
