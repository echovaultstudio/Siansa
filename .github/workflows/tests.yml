name: Device tests

# Runs the app on an Android emulator against a real Navidrome with a test library, behind a link
# limited to 4.3 Mbit/s like a phone's connection to a home server.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Start Navidrome with the test library
        run: scripts/test-server.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.navidromeUrl=http://10.0.2.2:5533 || (adb logcat -d > logcat.txt; exit 1)
            adb logcat -d > logcat.txt

      - name: Test output
        if: always()
        run: |
          grep -h -E "Kinds:|Animated cover drawable|New setup|Old setup|Musix log|I/|W/|E/" logcat.txt 2>/dev/null | grep -E "System.out|Kinds|setup|drawable" | tail -150 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
            ${{ runner.temp }}/navidrome-test/*.log
