name: Device tests

# Runs the app on an Android emulator against a real Navidrome with a test library, behind a link
# limited to 4.3 Mbit/s like a phone's connection to a home server.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Start Navidrome with the test library
        run: scripts/test-server.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.navidromeUrl=http://10.0.2.2:5533 || (adb logcat -d > logcat.txt; exit 1)
            adb logcat -d > logcat.txt

      # Results as annotations, so they can be read without downloading logs.
      - name: Test output
        if: always()
        run: |
          grep -h "System.out" logcat.txt 2>/dev/null | grep -E "Kinds:|drawable:|setup|Cover|Stream|Audio|Waited" | sed 's/.*System.out: //' | head -60 | while IFS= read -r line; do echo "::notice::$line"; done || true
          for f in app/build/outputs/androidTest-results/connected/**/*.xml app/build/outputs/androidTest-results/connected/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              fail = case.find("failure")
              name = case.get("name")
              if fail is not None:
                  msg = (fail.get("message") or fail.text or "").replace("\n", " ")[:400]
                  print(f"::error::FAILED {name}: {msg}")
              else:
                  print(f"::notice::PASSED {name} ({case.get('time')}s)")
          PY
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
            ${{ runner.temp }}/navidrome-test/*.log
