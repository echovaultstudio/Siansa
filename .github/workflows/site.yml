# Sends the website pages and the beta emails (deploy/site, deploy/emails) to the server when they change on main
# (issue #410). It uses the same restricted SSH key as the F-Droid publish: the server only accepts a tar.gz of
# plain files for this (deploy/scripts/siansa-site-update). Skipped until the FDROID_* secrets are set.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "deploy/site/**"
      - "deploy/emails/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Update the website and emails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Send to the server
        env:
          FDROID_HOST: ${{ secrets.FDROID_HOST }}
          FDROID_SSH_KEY: ${{ secrets.FDROID_SSH_KEY }}
          FDROID_KNOWN_HOSTS: ${{ secrets.FDROID_KNOWN_HOSTS }}
        run: |
          if [ -z "$FDROID_HOST" ] || [ -z "$FDROID_SSH_KEY" ] || [ -z "$FDROID_KNOWN_HOSTS" ]; then
            echo "::notice::No server set up (FDROID_HOST, FDROID_SSH_KEY, FDROID_KNOWN_HOSTS); skipped."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$FDROID_SSH_KEY" > ~/.ssh/fdroid && chmod 600 ~/.ssh/fdroid
          printf '%s\n' "$FDROID_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar czf site.tar.gz --exclude=README.md -C deploy site emails
          if ! ssh -i ~/.ssh/fdroid -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "siansa-deploy@$FDROID_HOST" site < site.tar.gz 2> ssh-error.txt; then
            # Why it failed, as annotations (readable without opening the log). The host name is masked.
            addr=$(getent ahosts "$FDROID_HOST" | awk '{print $1}' | sort -u | tr '\n' ' ')
            echo "::error::The server's address resolves to: ${addr:-nothing}"
            if timeout 10 bash -c "exec 3<>/dev/tcp/$FDROID_HOST/22" 2>/dev/null; then echo "::error::Port 22 is open"; else echo "::error::Port 22 can't be reached"; fi
            echo "::error::known_hosts has $(grep -c . ~/.ssh/known_hosts) line(s)"
            while IFS= read -r line; do echo "::error::ssh: $line"; done < <(tail -n 5 ssh-error.txt)
            rm -f ~/.ssh/fdroid
            exit 1
          fi
          cat ssh-error.txt
          rm -f ~/.ssh/fdroid
