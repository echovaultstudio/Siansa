name: Showcase screenshots

# The README's and website's screenshots (issue #741): the app on the emulator with a made-up library (invented
# artists, albums and covers, scripts/showcase), stand-ins for AudioMuse-AI and an AI service, and Audiobookshelf (its
# own image) with made-up books and podcasts, page by page at full size, plus the frames of the website's animations
# (anim-NAME-NN-MS.jpg, half size, each shown MS milliseconds). On demand, or on a pull request labelled "showcase".
# The pictures are pushed to the showcase-shots branch (one commit, replaced each time) and kept with the run;
# docs/screenshots/compose.py makes the README's from them, siansa-dev's deploy/site-shots.py the website's.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: write

# A new run replaces the one before for the same pull request; another pull request's push, or another label added,
# runs nothing and cancels nothing (a push to another pull request cancelled a run here).
concurrency:
  group: showcase-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'showcase' || github.event.pull_request && !contains(github.event.pull_request.labels.*.name, 'showcase')) && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  showcase:
    name: Showcase screenshots
    # On demand; or a push or the label just added to a pull request labelled "showcase" (not another label).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'showcase') &&
       (github.event.action != 'labeled' || github.event.label.name == 'showcase'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Install ffmpeg, Inter and the picture tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          sudo apt-get install -y -qq fonts-inter > /dev/null || echo "::warning::No Inter font: the covers' lettering uses DejaVu"
          python3 -m pip install --quiet --break-system-packages pillow numpy

      - name: Start Navidrome with the showcase library, the stand-ins, and Audiobookshelf
        run: scripts/showcase-server.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take the screenshots on a managed emulator
        run: |
          set -o pipefail
          gradle :app:ciPhoneDebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20 \
            -Pandroid.testInstrumentationRunnerArguments.class=app.siansa.ShowcaseTest \
            -Pandroid.testInstrumentationRunnerArguments.showcase=true \
            -Pandroid.testInstrumentationRunnerArguments.navidromeUrl=http://10.0.2.2:4533 \
            -Pandroid.testInstrumentationRunnerArguments.servicesUrl=http://10.0.2.2:8000 \
            -Pandroid.testInstrumentationRunnerArguments.booksUrl=http://10.0.2.2:13378 2>&1 | tee gradle.txt

      - name: The pictures, from the log
        if: always()
        run: |
          find app/build/outputs -iname "logcat*.txt" -exec cat {} + > logcat.txt 2>/dev/null || true
          python3 scripts/showcase_pictures.py logcat.txt shots notes.txt
          tail -3 "${RUNNER_TEMP}/showcase/services.log" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: showcase-phone
          path: |
            shots/
            logcat.txt
            gradle.txt

  tv:
    name: TV showcase screenshots
    # The TV app's pictures (tv/src/androidTest/.../TvShowcaseTest.kt) on an Android TV emulator at 1080p, next to the
    # phone's. Android TV's emulator images are 32-bit x86 only, which Gradle's managed devices don't start, so the
    # emulator is started here and the test run on it as on a connected TV.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'showcase') &&
       (github.event.action != 'labeled' || github.event.label.name == 'showcase'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TV_IMAGE: "system-images;android-34;android-tv;x86"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Install ffmpeg, Inter and the picture tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          sudo apt-get install -y -qq fonts-inter > /dev/null || echo "::warning::No Inter font: the covers' lettering uses DejaVu"
          python3 -m pip install --quiet --break-system-packages pillow numpy

      - name: Start Navidrome with the showcase library and the stand-ins
        run: scripts/showcase-server.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start an Android TV emulator
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$sdk/sdkmanager" --licenses > /dev/null || true
          "$sdk/sdkmanager" --install "$TV_IMAGE" emulator platform-tools > /dev/null
          echo no | "$sdk/avdmanager" create avd -n siansa-tv -k "$TV_IMAGE" -d tv_1080p --force
          "$ANDROID_HOME/emulator/emulator" -avd siansa-tv -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -40 "$RUNNER_TEMP/emulator.log"; exit 1; }
          "$adb" shell wm size
          # No animations of the system's own, so the pictures are of the app at rest.
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do "$adb" shell settings put global $s 0; done
          "$adb" logcat -c

      - name: Take the screenshots on the TV emulator
        run: |
          set -o pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" logcat -v brief > logcat.txt &
          gradle :tv:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=app.siansa.tvapp.TvShowcaseTest \
            -Pandroid.testInstrumentationRunnerArguments.showcase=true \
            -Pandroid.testInstrumentationRunnerArguments.navidromeUrl=http://10.0.2.2:4533 \
            -Pandroid.testInstrumentationRunnerArguments.servicesUrl=http://10.0.2.2:8000 2>&1 | tee gradle.txt

      - name: The pictures, from the log
        if: always()
        run: |
          sleep 3
          python3 scripts/showcase_pictures.py logcat.txt shots notes-tv.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: showcase-tv
          path: |
            shots/
            logcat.txt
            gradle.txt

  publish:
    name: Push the pictures to showcase-shots
    needs: [showcase, tv]
    if: always() && (needs.showcase.result != 'skipped' || needs.tv.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: showcase-*
          path: got
      # The phone's and the TV's, together in one commit (replaced each time).
      - name: Push them to the showcase-shots branch
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p shots
          for d in got/showcase-phone/shots got/showcase-tv/shots; do [ -d "$d" ] && cp -r "$d"/. shots/; done
          [ -n "$(ls shots 2>/dev/null)" ] || { echo "::warning::No screenshots to push"; exit 0; }
          cd shots
          git init -q -b showcase-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Showcase screenshots from ${SOURCE}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" showcase-shots
          echo "::notice::Pushed $(ls | wc -l) screenshots to the showcase-shots branch"
