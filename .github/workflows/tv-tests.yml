name: TV tests

# The TV app's remote sweep (tv/src/androidTest/.../TvRemoteSweepTest.kt, the owner, 12 Nov): every settings page
# pressed through with the remote on an Android TV emulator, so a button the remote can't reach fails the build.
# Runs on a pull request labelled "tv" and when asked. The emulator is started here (Gradle's managed devices don't
# make TVs); Android 16's image is the 64-bit Android TV one.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: tv-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: Remote sweep on a TV emulator
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'tv') &&
       (github.event.action != 'labeled' || github.event.label.name == 'tv'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TV_IMAGE: "system-images;android-36;android-tv;x86_64"
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start an Android TV emulator
        timeout-minutes: 15
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$sdk/sdkmanager" --licenses > /dev/null || true
          "$sdk/sdkmanager" --install "$TV_IMAGE" emulator platform-tools > /dev/null
          echo no | "$sdk/avdmanager" create avd -n siansa-tv -k "$TV_IMAGE" -d tv_1080p --force
          "$ANDROID_HOME/emulator/emulator" -avd siansa-tv -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 300 "$adb" wait-for-device || { echo "::error::The TV emulator didn't start"; tail -60 "$RUNNER_TEMP/emulator.log"; exit 1; }
          for i in $(seq 1 120); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -40 "$RUNNER_TEMP/emulator.log"; exit 1; }
          "$adb" shell wm size
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do "$adb" shell settings put global $s 0; done
          "$adb" logcat -c

      - name: Sweep every settings page with the remote
        timeout-minutes: 30
        run: |
          set -o pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" logcat -v brief > logcat.txt &
          gradle :tv:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=app.siansa.tvapp.TvRemoteSweepTest 2>&1 | tee gradle.txt

      - name: What the sweep found
        if: always()
        run: |
          grep -h "Sweep " logcat.txt | sed 's/.*Sweep /Sweep /' | sort -u | while read -r line; do echo "::notice::$line"; done || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tv-sweep
          path: |
            logcat.txt
            gradle.txt
            tv/build/reports/androidTests/
