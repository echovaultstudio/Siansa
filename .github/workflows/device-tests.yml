name: Emulator tests

# The emulator tests against a real Navidrome (app/src/androidTest), in one place for the two workflows that run them
# (issue #713): ci.yml after merges to main, nightly and on demand, and ui-tests.yml on pull requests labelled "ui".
on:
  workflow_call:
    inputs:
      device:
        description: "The Gradle managed device: ciPhone (Android 13) or android16"
        type: string
        default: ciPhone
      runs-on:
        description: 'The runner, as JSON: "ubuntu-latest" or ["self-hosted", "siansa"]'
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  device-tests:
    name: Emulator tests against Navidrome
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    steps:
      # The emulator needs ~7.5 GB for its storage; the runner image leaves too little free.
      - name: Free disk space
        # Only on GitHub's machines: it deletes system folders, never on your own runner.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          echo "::notice::Free disk: $(df -h / | awk 'NR==2{print $4}')"

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Start Navidrome with the test library
        run: scripts/test-server.sh

      - name: Enable KVM
        # GitHub's machines need it opened up; your own runner's user is in the kvm group instead.
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on a managed emulator
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          set -o pipefail
          device="$DEVICE"
          echo "::notice::Emulator: $device"
          gradle ":app:${device}DebugAndroidTest" \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20 \
            -Pandroid.testInstrumentationRunnerArguments.navidromeUrl=http://10.0.2.2:5533 2>&1 | tee gradle.txt
          
      # Results as annotations, so they can be read without downloading logs. GitHub shows only the first 10 errors and
      # 10 notices of a step, so the ones that explain a failure come first: failed tests, then a crash, then the build.
      - name: Test output
        if: always()
        run: |
          find app/build/outputs -iname "logcat*.txt" -exec cat {} + > logcat.txt 2>/dev/null || true
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          errors, notices, passed, total = [], [], 0, 0
          for f in sorted(glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True)):
              for case in ET.parse(f).getroot().iter("testcase"):
                  total += 1
                  fail = case.find("failure")
                  if fail is None:
                      passed += 1
                  else:
                      msg = (fail.get("message") or fail.text or "").replace("\n", " ")[:400]
                      errors.append(f"FAILED {case.get('classname', '').rsplit('.', 1)[-1]}.{case.get('name')}: {msg}")
          # A crash: the app's process dying ends the run, and its reason is only in the log.
          try:
              log = open("logcat.txt", errors="ignore").read().splitlines()
          except OSError:
              log = []
          for i, line in enumerate(log):
              if "FATAL EXCEPTION" in line or "OutOfMemoryError" in line or ("AndroidRuntime" in line and "Process: app.siansa" in line):
                  errors.append("crash: " + " | ".join(re.sub(r"^.*?AndroidRuntime: ", "", l).strip() for l in log[i:i + 4])[:400])
                  break
          try:
              gradle = open("gradle.txt", errors="ignore").read()
          except OSError:
              gradle = ""
          if "Process crashed" in gradle:
              errors.append("The app's process crashed during the run: the tests after it didn't run.")
          errors += [f"e: {m}" for m in sorted(set(re.findall(r"^e: file://\S*/app/(src/\S+ .*)$", gradle, re.M)))][:5]
          if not errors:
              errors += [l.strip() for l in re.findall(r"What went wrong:\n(?:.*\n){1,3}", gradle)][:2]
          notices.append(f"Emulator tests: {passed} of {total} passed")
          notices += [re.sub(r".*System.out: ", "", l) for l in log if "System.out" in l and re.search(r"Kinds:|drawable:", l)][:6]
          notices += [re.sub(r".*System.out: ", "", l) for l in log if "System.out" in l and re.search(r"setup|Tour: ", l)][:3]
          for e in errors[:10]:
              print("::error::" + e)
          for n in notices[:10]:
              print("::notice::" + n)
          PY

      # The app tour's screenshots (TOURSHOT lines in the log) as images in the device-test-results artifact.
      - name: Tour screenshots
        if: always()
        run: |
          [ -f logcat.txt ] || exit 0
          python3 - <<'PY'
          import re, base64, os, collections
          parts, totals = collections.defaultdict(dict), {}
          for line in open("logcat.txt", errors="ignore"):
              m = re.search(r"TOURSHOT (\S+) (\d+)/(\d+) (\S+)", line)
              if m:
                  parts[m[1]][int(m[2])] = m[4]
                  totals[m[1]] = int(m[3])
          os.makedirs("screens", exist_ok=True)
          for name, d in parts.items():
              if len(d) == totals[name]:
                  open(f"screens/{name}.jpg", "wb").write(base64.b64decode("".join(d[i] for i in sorted(d))))
              else:
                  print(f"{name}: only {len(d)} of {totals[name]} parts")
          print(len(os.listdir("screens")), "screenshots")
          PY
          grep -h "System.out" logcat.txt | grep -E "Tour: |song starts" | sed 's/.*System.out: //' > screens/tour.txt || true
          grep -h "TOURLOG " logcat.txt | sed 's/.*TOURLOG //' > screens/tour-log.txt || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-test-results
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            logcat.txt
            screens/
            ${{ runner.temp }}/navidrome-test/*.log
