name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A project uploaded through the website as musix-upload.zip is unpacked and committed here.
      - name: Unpack uploaded zip
        run: |
          if [ -f musix-upload.zip ]; then
            unzip -o -q musix-upload.zip
            git rm -q musix-upload.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Unpack uploaded project"
            git push
          fi

      - name: Check for project files
        id: project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No project files yet. Upload musix-upload.zip to the repository."
          fi

      - uses: actions/setup-java@v4
        if: steps.project.outputs.found == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.project.outputs.found == 'true'
        with:
          gradle-version: "8.11.1"

      # Every version needs its section in CHANGELOG.md; it becomes the release notes.
      - name: Release notes from CHANGELOG.md
        if: steps.project.outputs.found == 'true'
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          mkdir -p notes
          awk '/^## /{ v=$2; f="notes/" v ".md"; next } v { print > f }' CHANGELOG.md
          if [ ! -s "notes/$VERSION.md" ]; then
            echo "::error::CHANGELOG.md has no section '## $VERSION'. Add one before publishing."
            exit 1
          fi

      - name: Build
        if: steps.project.outputs.found == 'true'
        run: gradle :app:assembleRelease --stacktrace

      - name: Read version
        if: steps.project.outputs.found == 'true'
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; bump version.txt to publish a new one."
          fi

      - name: Rename APK
        if: steps.project.outputs.found == 'true'
        run: mv app/build/outputs/apk/release/app-release.apk musix-${{ steps.version.outputs.version }}.apk

      - uses: actions/upload-artifact@v4
        if: steps.project.outputs.found == 'true'
        with:
          name: musix-${{ steps.version.outputs.version }}
          path: musix-*.apk

      # One release per version, so the APK can be downloaded straight from the Releases page on a phone.
      - uses: softprops/action-gh-release@v2
        if: steps.project.outputs.found == 'true' && steps.version.outputs.exists != 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Musix ${{ steps.version.outputs.version }}
          body_path: notes/${{ steps.version.outputs.version }}.md
          files: musix-*.apk
          make_latest: true

      # Keeps the notes of every published version matching CHANGELOG.md, so fixes to the text show up too.
      - name: Sync release notes
        if: steps.project.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in notes/*.md; do
            v=$(basename "$f" .md)
            if gh release view "v$v" > /dev/null 2>&1; then
              gh release edit "v$v" --notes-file "$f"
            fi
          done

      # Removes the old numbered builds (build-1, build-2, ...) from before versions were used.
      - name: Remove old build releases
        if: steps.project.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes && echo "Deleted $tag"
          done
          git ls-remote --tags origin 'refs/tags/build-*' | awk '{print $2}' | sed 's#refs/tags/##' | while read -r tag; do
            git push origin ":refs/tags/$tag" && echo "Deleted tag $tag"
          done
