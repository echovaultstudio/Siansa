name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk musix-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: musix-${{ github.run_number }}
          path: musix-*.apk

      # A release per build, so the APK can be downloaded straight from the Releases page on a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Musix build ${{ github.run_number }}
          body: Built from ${{ github.sha }}
          files: musix-*.apk
          make_latest: true
