name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A project uploaded through the website as musix-upload.zip is unpacked and committed here.
      - name: Unpack uploaded zip
        run: |
          if [ -f musix-upload.zip ]; then
            unzip -o -q musix-upload.zip
            git rm -q musix-upload.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Unpack uploaded project"
            git push
          fi

      - name: Check for project files
        id: project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No project files yet. Upload musix-upload.zip to the repository."
          fi

      - uses: actions/setup-java@v4
        if: steps.project.outputs.found == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.project.outputs.found == 'true'
        with:
          gradle-version: "8.11.1"

      - name: Build
        if: steps.project.outputs.found == 'true'
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        if: steps.project.outputs.found == 'true'
        run: mv app/build/outputs/apk/release/app-release.apk musix-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: steps.project.outputs.found == 'true'
        with:
          name: musix-${{ github.run_number }}
          path: musix-*.apk

      # A release per build, so the APK can be downloaded straight from the Releases page on a phone.
      - uses: softprops/action-gh-release@v2
        if: steps.project.outputs.found == 'true'
        with:
          tag_name: build-${{ github.run_number }}
          name: Musix build ${{ github.run_number }}
          body: Built from ${{ github.sha }}
          files: musix-*.apk
          make_latest: true
