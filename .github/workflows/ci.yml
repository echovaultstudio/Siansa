name: CI

# Every push and pull request must compile, pass Android Lint, the unit tests and the secret scan; a
# release is published from main when those pass. The emulator tests against a real Navidrome run after
# each merge to main and nightly. They report problems (with screenshots) but don't hold back releases:
# their slow, throttled emulator makes timing results unreliable.
on:
  push:
    branches: [main]
  pull_request:
  # Actions → CI → Run workflow: builds, checks and releases main on demand.
  workflow_dispatch:
  # Nightly, so the emulator tests keep watching main even on quiet days.
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write
  # The release history (scripts/release_prs.py) looks up which pull request each commit came from.
  pull-requests: read
  # Release comments on the issues a release fixes (scripts/notify_fixed.py).
  issues: write

concurrency:
  # The nightly run has a group of its own: GitHub often starts it hours late, and in the shared group it
  # cancelled the run of a merge to main that was about to publish the release.
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # The quick checks in one job: the release scripts' tests, the secret scan, the plugin tests and whether the
  # emulator tests are needed (for the jobs below).
  quick:
    name: Quick checks
    # Always on GitHub's runners (free for a public repository): they start at once instead of waiting behind a
    # ten-minute build on the one self-hosted runner (issue #535).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app: ${{ steps.diff.outputs.app }}
      emulator: ${{ steps.diff.outputs.emulator }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release script tests
        run: python3 -m unittest discover -s scripts -q

      # Fails if a password, token or API key is committed (the whole history is checked).
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose --no-banner

      # The build, Lint, unit tests and plugin tests run on every push, pull request and nightly run. Only the
      # emulator tests are skipped after a merge to main that can't change what they see (issue #241: notes,
      # docs, the plugin). Nightly runs and runs started by hand always have them, so main is checked every night.
      - name: What changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          echo "app=true" | tee -a "$GITHUB_OUTPUT"
          if [ "$EVENT" != "push" ]; then echo "emulator=true" | tee -a "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with"; echo "emulator=true" | tee -a "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" | python3 scripts/ci_changes.py | grep '^emulator=' | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The AudioMuse-AI plugin in audiomuse-plugin/ (issue #188), with the libraries AudioMuse-AI ships.
      - name: Plugin tests
        run: |
          pip install --quiet numpy==2.4.6 scipy==1.16.3 av==17.1.0 Flask==3.1.3
          (cd audiomuse-plugin && python -m unittest discover -s tests -v)
          audiomuse-plugin/build.sh http://example.invalid

  checks:
    name: Build, lint and unit tests
    # Pull requests build on GitHub's runners, so nobody's pull request runs on the self-hosted runner at home (issue
    # #535). Pushes to main and the nightly run use your own runner when the RUNS_ON variable names it (e.g.
    # ["self-hosted", "siansa"]), else GitHub's. Clear RUNS_ON to put everything on GitHub's while your runner is down.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      # Notes waiting in changelog.d/ become the next version's section (see scripts/release_notes.py);
      # the APK is built with that version.
      - name: Version and release notes
        id: notes
        run: |
          python3 scripts/release_notes.py prepare | tee -a "$GITHUB_OUTPUT"
          awk '/^## /{ v=$2; f="notes/" v ".md"; next } v { print > f }' CHANGELOG.md

      # Compiling catches syntax and type errors; unit tests check the app's own logic; Android Lint
      # finds likely crashes, wrong API use and security issues. The release is built twice from the same code:
      # the APK for GitHub and F-Droid, and the app bundle (.aab) Google Play takes (issue #515).
      # The release key from the repository's secrets (public repo since #584): SIGNING_KEYSTORE_BASE64 is the
      # keystore file, base64; the passwords are secrets too. Without them (a fork's pull request) the build is
      # unsigned, which still checks everything but can't be published.
      - name: Signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/siansa.keystore"
            echo "SIANSA_KEYSTORE=$RUNNER_TEMP/siansa.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::No signing key (SIGNING_KEYSTORE_BASE64); the build is unsigned."
          fi

      - name: Unit tests, lint and release build
        env:
          SIANSA_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIANSA_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIANSA_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          # Pull requests also compare the screenshot tests' pictures with the approved ones (issue #710). Only there:
          # they're recorded on GitHub's runners (screenshots.yml), and another machine may draw a pixel differently.
          VERIFY=""; [ "$EVENT" = "pull_request" ] && VERIFY="-Proborazzi.test.verify=true"
          gradle :app:testDebugUnitTest $VERIFY :app:lintDebug :app:assembleRelease :app:bundleRelease --continue --stacktrace 2>&1 | tee gradle-build.txt

      - name: Test and lint results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          pictures = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for case in ET.parse(f).getroot().iter("testcase"):
                  fail = case.find("failure")
                  if fail is not None:
                      msg = (fail.get("message") or fail.text or "").replace("\n", " ")[:300]
                      print(f"::error::Unit test {case.get('classname').split('.')[-1]}.{case.get('name')} failed: {msg}")
                      pictures += case.get("classname", "").endswith("ScreenshotTest")
          if pictures:
              print(f"::warning::{pictures} screenshots differ from the approved ones. The before, after and difference "
                    "images are in the reports artifact (outputs/roborazzi). If the new look is meant, label the pull "
                    "request 'record screenshots' to approve it.")
          errors = warnings = 0
          for f in glob.glob("app/build/reports/lint-results-debug.xml"):
              for issue in ET.parse(f).getroot().iter("issue"):
                  sev = issue.get("severity")
                  loc = issue.find("location")
                  where = ""
                  if loc is not None:
                      path = loc.get("file", "").split("/siansa/")[-1]
                      where = f" file={path},line={loc.get('line', '1')}"
                  if sev in ("Error", "Fatal"):
                      errors += 1
                      print(f"::error{where}::Lint {issue.get('id')}: {issue.get('message')}")
                  else:
                      warnings += 1
          print(f"::notice::Lint: {errors} errors, {warnings} warnings")
          # Kotlin compile errors ("e: file:///…/X.kt:12:5 message") as annotations on the file and line.
          import os, re
          if os.path.exists("gradle-build.txt"):
              seen = 0
              for line in open("gradle-build.txt", errors="ignore"):
                  m = re.match(r"e: file://\S*?/siansa/(\S+?):(\d+):(\d+) (.*)", line.strip())
                  if m and seen < 40:
                      seen += 1
                      print(f"::error file={m[1]},line={m[2]},col={m[3]}::{m[4][:300]}")
              # Each "What went wrong" block, joined into one annotation per failure.
              lines = open("gradle-build.txt", errors="ignore").read().splitlines()
              for i, line in enumerate(lines):
                  if "What went wrong" in line:
                      block = []
                      for nxt in lines[i + 1:i + 40]:
                          if nxt.startswith("* Try") or nxt.startswith("* Exception"):
                              break
                          if nxt.strip():
                              block.append(nxt.strip())
                      text = " ".join(block)
                      # AndroidX's compatibility check: one short line per library and what it needs.
                      issues = re.findall(r"Dependency '([^']+)' requires (.+?)(?= \d+\.\s+Dependency|\s*$)", text)
                      if issues:
                          for dep, need in issues[:40]:
                              need = re.sub(r"\s+", " ", need)
                              need = re.sub(r"libraries and applications that depend on it to ", "", need)
                              print(f"::error::{dep}: {need[:200]}")
                      else:
                          print("::error::" + " | ".join(block)[:3000])
          PY

      - name: APK and bundle names
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Without the signing key (Dependabot, forks) Gradle names it app-release-unsigned.apk (issue #705).
          APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -1)
          mv "$APK" siansa-$VERSION.apk
          mv app/build/outputs/bundle/release/app-release.aab siansa-$VERSION.aab

      # Which key signed the release APK, in the run's summary: public information, and it proves a key change took.
      - name: Signing certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          out=$("$APKSIGNER" verify --print-certs "siansa-${{ steps.version.outputs.version }}.apk" 2>&1 | grep -m1 "SHA-256" || true)
          echo "::notice::Release APK signing certificate: ${out:-not signed (no signing secrets), or apksigner not found}"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            siansa-*.apk
            siansa-*.aab
            notes/
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            gradle-build.txt
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/

  device-tests:
    name: Emulator tests against Navidrome
    needs: [checks, quick]
    # Not on pull requests (20 minutes each); after merges to main that change the app, every night, and on demand.
    if: >-
      always() && needs.checks.result == 'success' && github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || needs.quick.outputs.emulator == 'true')
    # Your own runner when the RUNS_ON variable names it (e.g. ["self-hosted", "siansa"]), else GitHub's.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      # The emulator needs ~7.5 GB for its storage; the runner image leaves too little free.
      - name: Free disk space
        # Only on GitHub's machines: it deletes system folders, never on your own runner.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          echo "::notice::Free disk: $(df -h / | awk 'NR==2{print $4}')"

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Start Navidrome with the test library
        run: scripts/test-server.sh

      - name: Enable KVM
        # GitHub's machines need it opened up; your own runner's user is in the kvm group instead.
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on a managed emulator
        run: |
          set -o pipefail
          # After merges: Android 13. Nightly: Android 16, the version the app targets (issue #494). One emulator a run.
          device=ciPhone; [ "${{ github.event_name }}" = "schedule" ] && device=android16
          echo "::notice::Emulator: $device"
          gradle ":app:${device}DebugAndroidTest" \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20 \
            -Pandroid.testInstrumentationRunnerArguments.navidromeUrl=http://10.0.2.2:5533 2>&1 | tee gradle.txt
          
      # Results as annotations, so they can be read without downloading logs.
      - name: Test output
        if: always()
        run: |
          grep -A8 "What went wrong" gradle.txt 2>/dev/null | head -12 | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done || true
          # Kotlin compile errors in the emulator tests, with file and line (they don't show up in the Build job).
          grep -E "^e: file://" gradle.txt 2>/dev/null | sort -u | head -30 | sed -E 's#^e: file://[^ ]*/app/(src/[^:]+):([0-9]+):([0-9]+) (.*)#::error file=app/\1,line=\2,col=\3::\4#' || true
          grep -E "Tests? .*(passed|failed)|BUILD (SUCCESSFUL|FAILED)" gradle.txt 2>/dev/null | tail -3 | while IFS= read -r line; do echo "::notice::$line"; done || true
          find app/build/outputs -iname "logcat*.txt" -exec cat {} + > logcat.txt 2>/dev/null || true
          grep -h "System.out" logcat.txt 2>/dev/null | grep -E "Kinds:|drawable:|setup|Tour: " | sed 's/.*System.out: //' | head -40 | while IFS= read -r line; do echo "::notice::$line"; done || true
          for f in $(find app/build/outputs/androidTest-results -name "*.xml"); do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              fail = case.find("failure")
              name = case.get("name")
              if fail is not None:
                  msg = (fail.get("message") or fail.text or "").replace("\n", " ")[:400]
                  print(f"::error::FAILED {name}: {msg}")
              else:
                  print(f"::notice::PASSED {name} ({case.get('time')}s)")
          PY
          done

      # The app tour's screenshots (TOURSHOT lines in the log) as images in the device-test-results artifact.
      - name: Tour screenshots
        if: always()
        run: |
          [ -f logcat.txt ] || exit 0
          python3 - <<'PY'
          import re, base64, os, collections
          parts, totals = collections.defaultdict(dict), {}
          for line in open("logcat.txt", errors="ignore"):
              m = re.search(r"TOURSHOT (\S+) (\d+)/(\d+) (\S+)", line)
              if m:
                  parts[m[1]][int(m[2])] = m[4]
                  totals[m[1]] = int(m[3])
          os.makedirs("screens", exist_ok=True)
          for name, d in parts.items():
              if len(d) == totals[name]:
                  open(f"screens/{name}.jpg", "wb").write(base64.b64decode("".join(d[i] for i in sorted(d))))
              else:
                  print(f"{name}: only {len(d)} of {totals[name]} parts")
          print(len(os.listdir("screens")), "screenshots")
          PY
          grep -h "System.out" logcat.txt | grep -E "Tour: |song starts" | sed 's/.*System.out: //' > screens/tour.txt || true
          grep -h "TOURLOG " logcat.txt | sed 's/.*TOURLOG //' > screens/tour-log.txt || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-test-results
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            logcat.txt
            screens/
            ${{ runner.temp }}/navidrome-test/*.log

  release:
    name: Publish release
    needs: [checks, quick]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Your own runner when the RUNS_ON variable names it (e.g. ["self-hosted", "siansa"]), else GitHub's.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < notes/version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A file .release-hold on main holds releases back: merges keep collecting notes in changelog.d/,
          # and deleting the file publishes them all as one release.
          if [ -f .release-hold ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releases are on hold (.release-hold on main); v$VERSION will be published once it's removed."
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already released; nothing new to publish (no notes in changelog.d/)."
          elif [ ! -s "notes/$VERSION.md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No release notes for v$VERSION; add a note in changelog.d/ to publish one."
          fi

      # Moves the notes from changelog.d/ into CHANGELOG.md and sets version.txt, as a commit on main.
      - name: Record the release on main
        if: steps.version.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release_notes.py apply notes/fragments.txt
          git add -A CHANGELOG.md version.txt changelog.d
          # Only the notes' files count (the downloaded APK and notes/ aren't part of the repository).
          if ! git diff --cached --quiet; then
            git commit -q -m "Release ${{ steps.version.outputs.version }} [skip ci]"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi

      # One release per version with its notes. No files on it (#584): the app is had from the F-Droid repo and
      # Google Play's open testing, both below, and built from this source. The APK and bundle stay a workflow
      # artifact for 30 days (the Google Play workflow takes the bundle from there).
      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.exists != 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Siansa ${{ steps.version.outputs.version }}
          body_path: notes/${{ steps.version.outputs.version }}.md
          make_latest: true

      # Google Play's open testing (issue #557, #584): the .aab with the version's notes, through a service account that
      # can only release to testing tracks. Skipped until PLAY_SERVICE_ACCOUNT_JSON is set.
      - uses: actions/setup-python@v7
        if: steps.version.outputs.exists != 'true'
        with:
          python-version: "3.12"
      - name: Upload to Google Play
        if: steps.version.outputs.exists != 'true'
        # Play out of reach or refusing mustn't stop the release notes and history below; the error shows on the run.
        continue-on-error: true
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "::notice::No Google Play key (PLAY_SERVICE_ACCOUNT_JSON); skipped."; exit 0; fi
          pip install --quiet google-auth==2.40.3 requests==2.32.4
          python3 scripts/play_upload.py "$(ls siansa-*.aab | head -n 1)" "${{ steps.version.outputs.version }}" "notes/${{ steps.version.outputs.version }}.md"

      # The F-Droid repo on our server (issue #410; the server kit is in the private siansa-dev repo, #634): the APK
      # goes over SSH to a key that can only publish (siansa-publish there). Skipped until the FDROID_* secrets are set.
      - name: Publish to the F-Droid beta repo
        if: steps.version.outputs.exists != 'true'
        # A server that can't be reached mustn't stop the release notes and history below.
        continue-on-error: true
        env:
          FDROID_HOST: ${{ secrets.FDROID_HOST }}
          FDROID_SSH_KEY: ${{ secrets.FDROID_SSH_KEY }}
          FDROID_KNOWN_HOSTS: ${{ secrets.FDROID_KNOWN_HOSTS }}
        run: |
          if [ -z "$FDROID_HOST" ] || [ -z "$FDROID_SSH_KEY" ] || [ -z "$FDROID_KNOWN_HOSTS" ]; then
            echo "::notice::No F-Droid beta repo set up (FDROID_HOST, FDROID_SSH_KEY, FDROID_KNOWN_HOSTS); skipped."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$FDROID_SSH_KEY" > ~/.ssh/fdroid && chmod 600 ~/.ssh/fdroid
          printf '%s\n' "$FDROID_KNOWN_HOSTS" > ~/.ssh/known_hosts
          apk=$(ls siansa-*.apk | head -n 1)
          ssh -i ~/.ssh/fdroid -o BatchMode=yes -o StrictHostKeyChecking=yes "siansa-deploy@$FDROID_HOST" < "$apk"
          rm -f ~/.ssh/fdroid

      # Keeps the notes of every published version matching CHANGELOG.md, so fixes to the text show up too.
      - name: Sync release notes and titles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in notes/*.md; do
            v=$(basename "$f" .md)
            if gh release view "v$v" > /dev/null 2>&1; then
              gh release edit "v$v" --title "Siansa $v" --notes-file "$f"
            fi
          done

      # RELEASES.md lists every release with the pull requests in it, as a commit on main.
      - name: Update the release history
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin main
          python3 scripts/release_prs.py
          git add RELEASES.md
          if ! git diff --cached --quiet; then
            git commit -q -m "Release history [skip ci]"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi

      # Issues fixed in this release get a comment with the version, and are closed (issues #433, #606).
      - name: Tell reporters what's fixed
        if: steps.version.outputs.exists != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/notify_fixed.py "v${{ steps.version.outputs.version }}"
