name: Siansa Dev

# Siansa Dev (issue #824): the test build of what's coming, from the dev branch. It installs next to
# Siansa (its own app id app.siansa.dev, name and purple icon), and is published only here, as the APK of the
# pre-release "dev-latest" on GitHub: never to F-Droid or Google Play, never as a release of Siansa (the release
# history skips it). Each push to dev replaces the APK.
on:
  push:
    # experiment/…: a try-out (as Siansa Beats' grids) built as its own Siansa Dev download, never dev-latest.
    branches: [dev, "experiment/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish Siansa Dev
    # The same runner as main's builds: your own when the RUNS_ON variable names it, else GitHub's.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      # The whole history, main's too: the release notes list the changelog notes main hasn't released yet.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      # Signed with Siansa's key, so a later Siansa Dev installs over the last one.
      - name: Signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::No signing key (SIGNING_KEYSTORE_BASE64): an unsigned APK can't be installed."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/siansa.keystore"
          echo "SIANSA_KEYSTORE=$RUNNER_TEMP/siansa.keystore" >> "$GITHUB_ENV"

      # The unit tests first: a dev build is for listening, not for finding out the maths is wrong.
      - name: Unit tests and build
        env:
          SIANSA_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIANSA_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIANSA_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Siansa's own TV screen while casting (issue #114): the Cast app id, a repository variable (not a secret).
          CAST_RECEIVER_ID: ${{ vars.CAST_RECEIVER_ID }}
        run: gradle :app:testDebugUnitTest :app:assembleDev --continue --stacktrace

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          apk="siansa-dev-$short.apk"
          # dev's build is dev-latest; an experiment branch's is its own pre-release, so dev's stays as it is.
          tag=dev-latest
          title="Siansa Dev"
          if [ "$GITHUB_REF_NAME" != dev ]; then
            name="${GITHUB_REF_NAME#experiment/}"
            tag="dev-experiment-${name//\//-}"
            title="Siansa Dev, experiment $name"
          fi
          cp "$(ls app/build/outputs/apk/dev/*.apk | head -1)" "$apk"
          notes="Siansa Dev, built from \`$GITHUB_REF_NAME\` at $short on $(date -u '+%Y-%m-%d %H:%M') UTC.

          **Test build: only install it if you want to help find bugs and try features before they're finished.** Things may
          break, change or disappear without warning, and it may lose its settings. For everyday listening, get Siansa from
          its F-Droid repo or Google Play.

          The test build of the new audio engine. It installs next to Siansa (purple icon) and keeps its own settings,
          library and sign-ins. Not for F-Droid or Google Play.

          Latest change: $(git log -1 --format=%s)"
          # What's new: the changelog notes added since this release's last build, and how many earlier ones wait
          # for the next release (scripts/release_notes.py dev). The tag still points at that build until it's moved below.
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main "+refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          since=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          printf '%s\n\n' "$notes" > notes.md
          python3 scripts/release_notes.py dev --main origin/main ${since:+--since "$since"} >> notes.md \
            || echo "_The changelog couldn't be listed for this build._" >> notes.md
          git tag -f "$tag"
          git push -f origin "$tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            # The previous APKs go, so there's only ever one to pick.
            for old in $(gh release view "$tag" --json assets -q '.assets[].name'); do
              gh release delete-asset "$tag" "$old" -y
            done
            gh release edit "$tag" --title "$title ($short)" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$tag" --title "$title ($short)" --notes-file notes.md --prerelease --latest=false
          fi
          gh release upload "$tag" "$apk" --clobber
          echo "::notice::$title $short: $(gh release view "$tag" --json url -q .url)"
