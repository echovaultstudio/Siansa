name: Claude

# Label an issue "claude" (or mention @claude in an issue or pull request comment) and Claude implements
# it: it works on a branch, opens a pull request, and the normal CI checks run on it. Nothing is merged
# automatically. Only people with write access to the repository can trigger it.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN repository secret (made with `claude setup-token`, uses the Claude
# subscription) and the Claude GitHub App installed on the repository: https://github.com/apps/claude
on:
  issues:
    types: [labeled, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(gradle:*),Bash(git:*),Bash(./scripts/*)"
