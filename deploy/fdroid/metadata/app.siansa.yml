Name: Siansa
Summary: Music player for your own Navidrome or Emby server
Description: |-
  Siansa plays your music from your own Navidrome (or other OpenSubsonic) or Emby server.

  * Albums, artists, playlists, favourites and search, offline downloads and lyrics
  * Mixes made for the moment, Vibes, Song path and search by sound with AudioMuse-AI (optional)
  * Cast and DLNA, crossfade and levelling, sleep timer
  * No ads, no tracking: everything goes to servers you set up

  Open source under the GNU GPL 3 or later. These are beta builds: report problems from Settings › Help ›
  Report a problem, with the log.
AntiFeatures:
  NonFreeDep:
    en-US: Uses Google Cast for casting to TVs and speakers.
  NonFreeNet:
    en-US: Can use OpenRouter (AI titles), Last.fm and Deezer (artist photos) if you switch them on.
