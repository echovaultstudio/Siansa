# Siansa beta server (issue #410): website + privacy page + F-Droid repo + demo Navidrome, behind Caddy (HTTPS).
# Start: cp .env.example .env && edit .env && docker compose up -d
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls/${TLS_MODE:-cloudflare}.caddy:/etc/caddy/tls.caddy:ro
      - ./certs:/etc/caddy/certs:ro
      - ${SITE_DIR}:/srv/site:ro
      # The F-Droid repo that fdroidserver builds on this server (repo/ inside it is what's served).
      - ${FDROID_DIR}/repo:/srv/fdroid/repo:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  # Beta sign-up form handler: writes accepted sign-ups to ${SIGNUPS_DIR}/signups.jsonl. Only Caddy reaches it.
  signup:
    image: python:3.13-alpine
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-I", "/app/server.py", "8080"]
    environment:
      SIGNUPS_FILE: /data/signups.jsonl
      SIGNUP_SECRET: ${SIGNUP_SECRET:-}
      BETA_LIMIT: ${BETA_LIMIT:-12}
      PUBLIC_URL: https://${DOMAIN}
      NOTIFY_TO: ${NOTIFY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./signup/server.py:/app/server.py:ro
      - ${SIGNUPS_DIR}:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # A small library for Google Play's reviewers and testers. Only Caddy reaches it (no port of its own).
  navidrome-demo:
    image: deluan/navidrome:0.60.3
    restart: unless-stopped
    user: "1000:1000"
    environment:
      ND_BASEURL: ""
      ND_SCANNER_SCHEDULE: "@every 24h"
      ND_LOGLEVEL: info
      # The admin is made at first start with this password, so nobody else can claim the empty server first.
      ND_DEVAUTOCREATEADMINPASSWORD: ${DEMO_ADMIN_PASSWORD:?set DEMO_ADMIN_PASSWORD in .env}
      # Nothing that lets a demo account change what others see or reach the outside.
      ND_ENABLESHARING: "false"
      ND_ENABLEEXTERNALSERVICES: "false"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLEUSEREDITING: "false"
      ND_ENABLEDOWNLOADS: "true"
      ND_ENABLETRANSCODINGCONFIG: "false"
      ND_AUTHREQUESTLIMIT: "5"
      ND_AUTHWINDOWLENGTH: "20s"
    volumes:
      - ${DEMO_DATA_DIR}:/data
      - ${DEMO_MUSIC_DIR}:/music:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy_data:
  caddy_config:
