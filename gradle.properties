org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# The Kotlin compiler's own memory: the phone and TV apps compile side by side in CI, and 4 GB (what it took from
# the line above) ran out on 11 Nov ("GC overhead limit exceeded" in :app and :tv compileKotlin, on main too).
kotlin.daemon.jvmargs=-Xmx6g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.caching=true
# Siansa's own TV screen while casting (issue #114): the receiver's app id from the Google Cast console, once it's
# registered (see cast-receiver/README.md). Empty: Google's standard TV screen. CAST_RECEIVER_ID overrides it.
siansa.castReceiverId=14717CD8
